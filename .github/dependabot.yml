version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]
      go-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    ignore:
      # The console is built with the Node major CI and the release use
      # (node-version in ci.yml and release.yml); the three move together,
      # by hand, so an image built from source embeds the released bundle.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  # The compose files pin caddy, guacd and postgres by digest; the docker
  # ecosystem above reads only the Dockerfiles.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-deps:
        patterns: ["*"]
      web-security:
        applies-to: security-updates
        patterns: ["*"]
