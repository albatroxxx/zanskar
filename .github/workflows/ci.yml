name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the default token is read-only; jobs that need more declare it
# themselves (job-level permissions replace this block for that job).
permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zanskar
          POSTGRES_PASSWORD: zanskar
          POSTGRES_DB: zanskar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zanskar" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web UI
        run: cd web && npm ci --ignore-scripts --no-fund --no-audit && npm run build && npx oxlint src
      - run: go mod verify
      - run: go vet ./...
      - run: go build -trimpath -tags webui ./...
      - name: Test (SQLite and PostgreSQL)
        env:
          ZANSKAR_TEST_POSTGRES_DSN: postgres://zanskar:zanskar@localhost:5432/zanskar_test?sslmode=disable
        run: go test -race -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
      - name: Migration sets match
        run: diff <(ls migrations/postgres) <(ls migrations/sqlite)

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
          go-package: ./...

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: securego/gosec@deb54465fea23d19a77f037e11e6589021f8501d # v2.29.0
        with:
          args: -no-fail -fmt sarif -out gosec.sarif ./...
      - uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          sarif_file: gosec.sarif

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  notices:
    name: Third-party notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps (for the npm dependency tree)
        run: cd web && npm ci --ignore-scripts --no-fund --no-audit
      - name: Verify THIRD_PARTY_NOTICES.md is current
        run: |
          bash hack/gen-notices.sh > THIRD_PARTY_NOTICES.md
          if ! git diff --quiet THIRD_PARTY_NOTICES.md; then
            echo "::error::THIRD_PARTY_NOTICES.md is out of date. Regenerate it with: hack/gen-notices.sh > THIRD_PARTY_NOTICES.md"
            git --no-pager diff --stat THIRD_PARTY_NOTICES.md
            exit 1
          fi

  coverage-badge:
    # Publishes the total statement coverage as a shields.io endpoint JSON on
    # the orphan `badges` branch (README reads it). Runs only on pushes to
    # main; the write token is scoped to this job alone.
    name: Coverage badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: write # push coverage.json to the badges branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
      - name: Compute total coverage
        id: cov
        run: |
          pct=$(awk 'NR>1 { s+=$2; if ($3>0) c+=$2 } END { printf "%.1f", 100*c/s }' coverage.out)
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          echo "total statement coverage: $pct%" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish badge JSON
        env:
          PCT: ${{ steps.cov.outputs.pct }}
        run: |
          set -euo pipefail
          color=red
          awk -v p="$PCT" 'BEGIN { exit !(p >= 40) }' && color=orange
          awk -v p="$PCT" 'BEGIN { exit !(p >= 50) }' && color=yellow
          awk -v p="$PCT" 'BEGIN { exit !(p >= 60) }' && color=yellowgreen
          awk -v p="$PCT" 'BEGIN { exit !(p >= 70) }' && color=green
          awk -v p="$PCT" 'BEGIN { exit !(p >= 80) }' && color=brightgreen
          json=$(printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$PCT" "$color")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin badges:refs/remotes/origin/badges 2>/dev/null; then
            git checkout -q -B badges origin/badges
          else
            git checkout -q --orphan badges
            git rm -rfq . >/dev/null 2>&1 || true
          fi
          printf '%s' "$json" > coverage.json
          if git diff --quiet -- coverage.json 2>/dev/null && [ -n "$(git ls-files coverage.json)" ]; then
            echo "coverage unchanged ($PCT%)"; exit 0
          fi
          git add coverage.json
          git commit -qm "coverage: $PCT% (${GITHUB_SHA::7})"
          git push -q origin badges

