name: release

# Tag a version (e.g. v1.0.0) to build the release. goreleaser cross-compiles
# the binaries, builds tar.gz archives, deb/rpm packages (built-in nfpm), an
# SPDX SBOM per archive and SHA256SUMS over all of them, pushes the multi-arch
# image to ghcr.io, signs checksums and image with cosign (keyless, this
# workflow's OIDC identity), and attaches everything to a GitHub release
# (created as a draft to review before publishing). The provenance job then
# adds SLSA build provenance for every file in SHA256SUMS to the same draft.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # A tag builds a release only from a commit that is on main and whose CI
  # run passed. Without this, any v* tag pushed from any branch published an
  # image to ghcr.io and moved :latest before the draft release was looked at.
  # The repository's tag ruleset on v* is the other half (who may push a tag);
  # this is the half the workflow can check for itself.
  gate:
    name: tag is on main with green CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # list the CI workflow's runs for the commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tagged commit is an ancestor of main
        id: commit
        # An annotated tag's own object is peeled to the commit it names, so
        # both checks look at the commit whichever kind of tag was pushed.
        run: |
          set -euo pipefail
          sha=$(git rev-parse "${GITHUB_SHA}^{commit}")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at ${sha::12}, which is not on main; releases are cut from main only"
            exit 1
          fi
      - name: CI passed for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        # The CI workflow's own run for this commit, the one its push to main
        # started, must have completed with success. Only ci.yml is asked,
        # not every check on the commit: this gate is itself a check run on
        # it, still in progress, and so are the release jobs behind it, and a
        # scheduled scan that failed on the commit is no reason to hold a
        # release. A commit whose CI never ran, is still running, or failed
        # is refused.
        run: |
          set -euo pipefail
          runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=20" --jq '.workflow_runs[] | "\(.event)\t\(.status)\t\(.conclusion)\t\(.html_url)"')
          printf 'CI runs for %s:\n%s\n' "${SHA::12}" "${runs:-none}"
          if ! grep -qP '^push\tcompleted\tsuccess\t' <<<"$runs"; then
            echo "::error::no successful CI run for the push of ${SHA::12} to main; wait for CI or fix it before tagging"
            exit 1
          fi

  # The console bundle is built here, by third-party build code (Vite and its
  # plugins from node_modules), in a job that holds a read-only token and no
  # OIDC identity. The release job below only downloads the result, so no
  # build-time package ever runs where it could push an image, edit the
  # release or sign as this workflow.
  web:
    name: web bundle
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  goreleaser:
    name: goreleaser
    needs: [gate, web]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    permissions:
      contents: write # create the GitHub release and upload artifacts
      packages: write # push the image to ghcr.io
      id-token: write # keyless cosign signing (Sigstore Fulcio)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser needs full history and tags
          # goreleaser reads the history locally and talks to GitHub with
          # GITHUB_TOKEN; it never pushes, so the checkout keeps no token.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # The bundle the web job built; goreleaser's own `make web` hook is
      # skipped below so nothing from node_modules runs in this job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      # THIRD_PARTY_NOTICES.md currency is enforced by the CI 'notices' job on
      # every push to main, so a tag cut from main already carries a current
      # file; goreleaser bundles it into the archives.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        id: goreleaser
        with:
          version: "~> v2"
          args: release --clean --skip=before
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The provenance subjects are exactly the lines of SHA256SUMS: every
      # archive, package and SBOM, by name and digest.
      - name: Hash the release files for provenance
        id: hashes
        env:
          ARTIFACTS: ${{ steps.goreleaser.outputs.artifacts }}
        run: |
          set -euo pipefail
          sums=$(echo "$ARTIFACTS" | jq -r '.[] | select(.type == "Checksum") | .path')
          echo "hashes=$(base64 -w0 < "$sums")" >> "$GITHUB_OUTPUT"
      # Hand-written highlights for this tag, if the repo carries them, go
      # above goreleaser's generated install block and commit list. The
      # generated changelog only covers commits since the previous tag, which
      # is the wrong story for a first release.
      - name: Prepend release highlights (docs/releases/<tag>.md)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          f="docs/releases/${TAG}.md"
          if [ ! -f "$f" ]; then echo "no $f; keeping generated notes"; exit 0; fi
          gh release view "$TAG" --json body -q .body > generated.md
          { cat "$f"; echo; cat generated.md; } > notes.md
          gh release edit "$TAG" --notes-file notes.md
          echo "prepended $f"

  # The browser an application opens in (ADR 0034): one native build per
  # architecture (an apt install under QEMU takes a quarter of an hour), then
  # one manifest under the version tag, latest for a release, signed keyless.
  browser-image:
    name: browser image (${{ matrix.arch }})
    needs: [gate]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest-amd64: ${{ steps.build.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.build.outputs.digest-arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        env:
          ARCH: ${{ matrix.arch }}
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image=ghcr.io/albatroxxx/zanskar-browser
          version=${TAG#v}
          # The package layer comes from the last release's image when apt
          # would install the same versions (deploy/browser/build.sh), so
          # an upgrade downloads only what changed.
          prev=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
          deploy/browser/build.sh "$ARCH" "$image:$version-$ARCH" "${prev:+$image:${prev#v}-$ARCH}" \
            --label org.opencontainers.image.source=https://github.com/albatroxxx/zanskar \
            --label org.opencontainers.image.version="$version" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.licenses=Apache-2.0 \
            --label org.opencontainers.image.description="The isolated browser a Zanskar application session runs in"
          docker push "$image:$version-$ARCH"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image:$version-$ARCH" | cut -d@ -f2)
          echo "digest-$ARCH=$digest" >> "$GITHUB_OUTPUT"

  browser-manifest:
    name: browser image manifest
    needs: [browser-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing of the manifest
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: One manifest per tag, signed
        env:
          TAG: ${{ github.ref_name }}
          AMD64: ${{ needs.browser-image.outputs.digest-amd64 }}
          ARM64: ${{ needs.browser-image.outputs.digest-arm64 }}
        run: |
          set -euo pipefail
          image=ghcr.io/albatroxxx/zanskar-browser
          version=${TAG#v}
          docker buildx imagetools create -t "$image:$version" "$image@$AMD64" "$image@$ARM64"
          # latest moves for a release only, never for a release candidate.
          case "$version" in *-*) ;; *) docker buildx imagetools create -t "$image:latest" "$image@$AMD64" "$image@$ARM64" ;; esac
          digest=$(docker buildx imagetools inspect "$image:$version" --format '{{json .Manifest.Digest}}' | tr -d '"')
          cosign sign --yes "$image@$digest"
          echo "$image:$version is $digest" | tee -a "$GITHUB_STEP_SUMMARY"

  # SLSA build provenance (level 3) for every file in SHA256SUMS, signed by the
  # SLSA generator's own reusable workflow and uploaded to the draft release as
  # zanskar.intoto.jsonl. It is referenced by tag, not digest, because the
  # generator verifies its own ref and refuses to run from a SHA. Scorecard's
  # Pinned-Dependencies check counts this one line as unpinned; that is the
  # accepted cost of level 3 provenance, and the only unpinned reference here.
  provenance:
    name: provenance
    needs: [goreleaser]
    permissions:
      actions: read # read the workflow run it attests
      id-token: write # sign the provenance (Sigstore)
      contents: write # upload it to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.goreleaser.outputs.hashes }}"
      upload-assets: true
      draft-release: true
      provenance-name: zanskar.intoto.jsonl
