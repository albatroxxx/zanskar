name: release

# Tag a version (e.g. v1.0.0) to build the release. goreleaser cross-compiles
# the binaries, builds tar.gz archives, deb/rpm packages (built-in nfpm) and
# SHA256SUMS, pushes the multi-arch image to ghcr.io, signs checksums and image
# with cosign (keyless, this workflow's OIDC identity), and attaches everything
# to a GitHub release (created as a draft to review before publishing).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload artifacts
      packages: write # push the image to ghcr.io
      id-token: write # keyless cosign signing (Sigstore Fulcio)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser needs full history and tags
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # THIRD_PARTY_NOTICES.md currency is enforced by the CI 'notices' job on
      # every push to main, so a tag cut from main already carries a current
      # file; goreleaser bundles it into the archives.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Hand-written highlights for this tag, if the repo carries them, go
      # above goreleaser's generated install block and commit list. The
      # generated changelog only covers commits since the previous tag, which
      # is the wrong story for a first release.
      - name: Prepend release highlights (docs/releases/<tag>.md)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          f="docs/releases/${TAG}.md"
          if [ ! -f "$f" ]; then echo "no $f; keeping generated notes"; exit 0; fi
          gh release view "$TAG" --json body -q .body > generated.md
          { cat "$f"; echo; cat generated.md; } > notes.md
          gh release edit "$TAG" --notes-file notes.md
          echo "prepended $f"
