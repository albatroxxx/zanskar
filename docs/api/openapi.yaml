openapi: 3.1.0
info:
  title: Zanskar API
  version: "1"
  summary: Agentless VM access gateway
  description: |
    Zanskar exposes a JSON API under `/api/v1` and its WebSocket endpoints under `/ws`.
    `info.version` is the API version, matching the `/api/v1` prefix, not the release version;
    `GET /version` returns the running release to a signed-in caller.

    ## Authentication

    Every authenticated request carries the session cookie: `__Host-zanskar_session` where the
    gateway serves HTTPS (or trusts a TLS-terminating proxy), `zanskar_session` on plain-HTTP
    loopback, where the prefix is not allowed. The cookie value is an opaque random token; the
    server stores only its SHA-256 hash (`auth_sessions.token_hash`). The cookie is set with
    `HttpOnly`, `Secure`, `SameSite=Strict` and `Path=/`. A sign-in made from a browser that
    already holds a session ends that session and audits it as a sign-out with reason `replaced`.

    Sessions are created by `POST /auth/login`. When the account has TOTP enrolled, or the
    deployment requires MFA, the login response returns `mfa_required` and the session is created
    with `mfa_verified=false`. Such a session may only call the `/auth/mfa/*` endpoints until
    `POST /auth/mfa/totp/verify` succeeds.

    The step that completes a sign-in (the second factor, the enrolment a sign-in owes, or a
    password change that was its last step) sets a new cookie. The token used while signing in
    stops working, so a cookie planted in the browser beforehand never becomes a signed-in one.
    The session, its id and its CSRF token carry on.

    The temporary lock that wrong passwords set (see `POST /auth/login`) stops new sign-ins
    only; sessions already signed in carry on. When the gateway cannot check a session cookie
    because its database does not answer, API calls and WebSocket upgrades get `503` with code
    `unavailable` and the cookie is kept: try again in a moment.

    ## CSRF

    Every mutating request (`POST`, `PUT`, `PATCH`, `DELETE`) must send the `X-CSRF-Token` header.
    The token is returned by `POST /auth/login` and `GET /auth/me` in the `csrf_token` field and is
    bound to the session. Requests without a matching token are rejected with `403 csrf_invalid`.
    WebSocket upgrades are protected by the one-time connect ticket instead.

    ## Roles

    - `admin`: manages configuration (users, groups, identity providers, credentials, targets,
      autoscaling groups, policies), can terminate sessions, and can read the audit log and
      recordings.
    - `auditor`: reads the audit log, verifies the hash chain, and views recordings, but cannot
      change configuration. Every recording view and audit query is itself recorded in
      `recording_views` and in the audit log, whichever role performs it.
    - `user`: sees the targets their groups' policies grant and opens sessions to them.

    Endpoints are tagged by the role that may call them. A caller holding several roles may call
    any endpoint tagged with one of them. `user`-tagged endpoints also admit `admin`; an account
    holding only `auditor` is review-only and receives `403` with code `review_only` from them.

    ## Pagination

    Paged lists accept `limit` (default 50, max 200 unless a route says otherwise) and `cursor`.
    Responses contain `items` and, when more remain, `next_cursor`; no `next_cursor` means the
    list is exhausted. Cursors are opaque; do not construct them. A few short lists, such as
    autoscaling groups, are not paged and say so.

    ## Errors

    All errors use the `Error` schema. `request_id` matches the `X-Request-Id` response header
    and is written to the server log, so include it in bug reports.

    ## Secrets

    Fields marked `writeOnly` (passwords, private keys, identity provider client secrets) are
    accepted on create and update and are never returned by any endpoint.

    ## Timestamps

    All timestamps are RFC 3339 strings in UTC.
  license:
    name: Apache 2.0
    identifier: Apache-2.0

servers:
  - url: /api/v1

tags:
  - name: system
    description: Unauthenticated liveness and version endpoints.
  - name: scim
    description: |
      SCIM 2.0 (RFC 7643, RFC 7644) for identity providers that push their people to Zanskar:
      Okta, Entra ID, OneLogin, JumpCloud, PingOne, Authentik. Each provider has its own base,
      `/api/v1/scim/{idp}`, and authenticates with the bearer token the console made for it
      (`POST /identity-providers/{id}/scim-token`). Users only; `/Groups` answers 501 for any
      method. Requests and answers are `application/scim+json` (plain JSON is accepted).
  - name: auth
    description: Login, MFA, and session endpoints for any authenticated user.
  - name: user
    description: Endpoints for the `user` role, also callable by `admin`. Refused with `403 review_only` for accounts that hold only `auditor`.
  - name: admin
    description: Endpoints for the `admin` role.
  - name: auditor
    description: Read-only review endpoints, callable by `auditor` and `admin`.
  - name: websocket
    description: Session transport endpoints (documented, not callable as REST).

security:
  - cookieAuth: []

paths:
  # ------------------------------------------------------------------ system
  /healthz:
    servers:
      - url: /
    get:
      tags: [system]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    servers:
      - url: /
    get:
      tags: [system]
      summary: Readiness probe
      description: Returns 200 only when the database and, if configured, guacd are reachable.
      security: []
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: A dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /version:
    get:
      tags: [system]
      summary: Version
      description: >-
        Returns the release version only, to any signed-in caller. No commit hash, build host,
        or dependency list. Not answered without a session, so the release is not advertised to
        whoever can reach the gateway.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Version string.
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version:
                    type: string
                    examples: ["0.1.0"]

  # ------------------------------------------------------------------ auth
  /auth/login:
    post:
      tags: [auth]
      summary: Log in with username and password
      description: |
        Rate limited per source address, an IPv6 client by its /64; while the limiter is full of
        other addresses, a new one gets the same `429`. A run of `429`s to one address is audited
        once, as `user.login` with reason `rate_limited`, not once per attempt. Each attempt checks
        a password, and only so many checks run at once: one that waits too long for its turn gets
        `503` with code `busy`.

        Wrong passwords and wrong second-factor codes count against the account together: five in
        a row, from whichever clients, lock it against new sign-ins for 15 minutes
        (`locked_until`), and a locked account gets the same `401` as a wrong password. Sessions
        already signed in carry on. The count is cleared when a sign-in completes, not by the
        right password while a second factor is still owed. The response body does not reveal
        whether the username exists. On success the `zanskar_session` cookie is set.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login accepted. Check `status`.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: "`__Host-zanskar_session=<opaque>; HttpOnly; Secure; SameSite=Strict; Path=/` (`zanskar_session` on plain-HTTP loopback)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: >
            `busy`: too many password checks are running at once; try again in a moment. The
            attempt was not checked, so it is neither counted against the account nor audited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/mfa/step-up:
    post:
      tags: [auth]
      summary: Prove the authenticator again on a signed-in session
      description: >
        For the actions the console guards with a recent code (ADR 0032): records the time of
        the proof on the session, which the host-action routes check (five minutes). Limited
        per session; every outcome is audited as `user.mfa.verify` with purpose `step_up`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: A six-digit authenticator code or a recovery code.
      responses:
        "200":
          description: Proved.
        "409":
          description: No authenticator enrolled (`mfa_not_enrolled`).
        "422":
          description: Wrong or already-used code (`bad_code`).
        "429":
          description: >-
            Too many attempts on this session (`rate_limited`), or five wrong codes closed the
            route for this session for fifteen minutes (`step_up_closed`); the account's own
            sign-in budget is not charged by step-up guesses.
  /auth/mfa/totp/verify:
    post:
      tags: [auth]
      summary: Complete login with a TOTP code
      description: Marks the current session `mfa_verified`. Accepts a recovery code in place of a TOTP code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCode"
      responses:
        "200":
          description: Session is now fully authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: |
            `invalid_code`: the code is wrong; try again. Wrong codes count against the account
            together with wrong passwords (see `POST /auth/login`). After five wrong codes the
            half-finished sign-in ends and the reply's `code` is `sign_in_ended`: start again from
            the password. A sign-in whose account is locked ends the same way, whatever the code.
            `unauthenticated`: there is no sign-in in progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/password:
    post:
      tags: [auth]
      summary: Replace the caller's password
      description: |
        The step owed when an administrator set the password (`password_change_required` at
        sign-in, `pending: password` on `/auth/me`), or a change of the caller's own from a
        full session. The current password is required either way. Every other session of the
        account ends; the one that made the change carries on. Afterwards the sign-in
        continues where it would have: the response is a LoginResponse whose status is
        `mfa_required`, `mfa_enrollment_required` or `ok`. Audited as `user.password.change`,
        with the number of other sessions ended in `other_sessions_revoked`.

        A wrong current password counts against the account like a wrong sign-in password: the
        fifth in a row locks the account, and while it is locked the change is refused with
        `429 too_many_attempts` before any password is checked, so a session cannot go on
        guessing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                  writeOnly: true
                new_password:
                  type: string
                  minLength: 12
                  writeOnly: true
      responses:
        "200":
          description: The password was replaced; the status says what is owed next.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: The new password fails the policy or repeats the current one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: The current password is wrong (`invalid_credentials`); it is counted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "`too_many_attempts`: the account is locked after wrong passwords; try again later."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >
            `busy`: too many password checks are running at once; try again in a moment. Nothing
            was changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/mfa/totp/enroll:
    post:
      tags: [auth]
      summary: Start TOTP enrollment
      description: |
        Generates a new secret for the caller. The secret and the `otpauth://` URI are returned
        exactly once. Enrollment is not active until `POST /auth/mfa/totp/confirm` succeeds.
        Re-enrolling replaces an unconfirmed secret; a confirmed authenticator cannot be replaced
        through the API (`409 already_enrolled`), only reset by an administrator.

        From a fully signed-in session the body must carry the caller's `current_password`, so a
        stolen session cannot enrol another device and lock the owner out: `401
        password_required` without it, `401 invalid_credentials` when it is wrong (counted like a
        wrong sign-in password), `429 too_many_attempts` while the account is locked. Enrolling
        as the step a sign-in still owes needs no password. An account that signs in through an
        identity provider has no local password to give, so from a full session it may enrol only
        within five minutes of signing in; later it is `401 reauth_required` and the person signs
        in through the provider again first. Confirming an authenticator from a full session ends
        the account's other sessions, as a password change does.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                  writeOnly: true
      responses:
        "200":
          description: Enrollment material.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpEnrollment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: "`already_enrolled`: an authenticator is confirmed already."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "`too_many_attempts`: the account is locked after wrong passwords; try again later."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/mfa/totp/confirm:
    post:
      tags: [auth]
      summary: Confirm TOTP enrollment
      description: Proves possession of the authenticator. Returns one-time recovery codes, shown once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCode"
      responses:
        "200":
          description: TOTP is now active.
          content:
            application/json:
              schema:
                type: object
                required: [recovery_codes]
                properties:
                  recovery_codes:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: >
            The code is wrong; `code` is `invalid_code`. Audited as a failed `user.mfa.confirm`.
            Wrong codes count against the account together with wrong passwords (see
            `POST /auth/login`). When enrolment is the step a sign-in still owes and the account is
            locked, by this code or before it, the sign-in ends instead and `code` is
            `sign_in_ended`: start again from the password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            `not_enrolled` before enrollment has started; `already_enrolled` once an authenticator is
            confirmed. A confirmed authenticator is never replaced or confirmed again through the API;
            an admin resets it first, so a stolen session cannot swap the second factor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current session
      description: |
        Revokes the session and clears the cookie. A session that signed in through an OIDC
        provider is signed out there too (ADR 0035), unless the provider is set to
        `keep_provider_session`: the answer names the provider's `end_session_endpoint` with
        `id_token_hint`, `client_id`, `state=signed-out` and the provider's callback as
        `post_logout_redirect_uri`, and the console sends the browser there. The provider
        sends it back to the callback, which goes on to `/login`.
      responses:
        "200":
          description: Session revoked and cookie cleared.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  redirect:
                    type: string
                    format: uri
                    description: The provider's sign-out page to visit next; absent for a local sign-out.
  /auth/me:
    get:
      tags: [auth]
      summary: Current user
      responses:
        "200":
          description: The caller, their roles, and a fresh CSRF token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/providers:
    get:
      tags: [auth]
      summary: Sign-in providers
      description: |
        The enabled identity providers, by name, for the sign-in page to offer. Callable before
        signing in. Only `id`, `name` and `type` are returned; no configuration. Not paged:
        every enabled provider is in `items`.
      security: []
      responses:
        "200":
          description: Enabled providers, ordered by name.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name, type]
                      properties:
                        id:
                          type: string
                          description: Use it in `/auth/oidc/{id}/start`.
                        name:
                          type: string
                        type:
                          type: string
                          enum: [oidc, ldap]
  /auth/oidc/{id}/start:
    get:
      tags: [auth]
      summary: Begin an OIDC login
      description: |
        Redirects the browser to the provider's authorization endpoint with PKCE, `state` and
        `nonce`. The sign-in page links here for each provider listed by `GET /auth/providers`.
        If the provider cannot be reached, redirects to `/login?error=provider_unavailable`.
      security: []
      parameters:
        - $ref: "#/components/parameters/IdpId"
        - name: next
          in: query
          description: A console path to land on after sign-in. Anything that is not a local path is ignored.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the identity provider.
  /auth/oidc/{id}/callback:
    get:
      tags: [auth]
      summary: OIDC redirect callback
      description: |
        The provider sends the browser back here. On success the session cookie is set and the
        browser goes to `next` (or the portal). On failure the browser goes to
        `/login?error=<reason>` and a failed `user.login` is audited. An OIDC sign-in asks for no
        Zanskar second factor unless the provider is marked `zanskar_mfa` (ADR 0035).

        After the provider's sign-out (`POST /auth/logout`) the browser comes back here with
        `state=signed-out` and no `code`; it goes on to `/login`, and nothing is recorded.
      security: []
      parameters:
        - $ref: "#/components/parameters/IdpId"
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirect into the console, or back to the sign-in page with an error.

  # ------------------------------------------------------------------ user
  /me/targets:
    get:
      tags: [user]
      summary: Targets the caller may reach
      description: |
        Evaluates the grants of every enabled policy that names the caller or a group they
        belong to (ADR 0036). Returns static targets, applications and autoscaling groups with
        the union of the protocols those grants give, intersected with the target's probed
        capabilities.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: q
          in: query
          description: Substring match on name, address, or tag value.
          schema:
            type: string
      responses:
        "200":
          description: Reachable targets.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PagedResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ReachableTarget"
  /me/autoscaling-groups/{id}/instances:
    get:
      tags: [user]
      summary: Healthy instances in an autoscaling group
      description: |
        Only instances that are `InService`, have `lb_health` healthy or null, and `probe_health`
        healthy are returned. The caller must have a policy that grants the group.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Healthy pool.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PagedResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/AsgInstance"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /me/access-requests:
    post:
      tags: [user]
      summary: Request just-in-time access to a target or an autoscaling group
      description: |
        Ask for time-bounded access to a target or an autoscaling group the caller is *eligible*
        for — one an `approval` grant of an enabled policy of theirs covers (ADR 0018, ADR 0036). The request starts `pending` until
        an admin approves or denies it. Standing access needs no request: a user who already has
        it connects directly through `/connect`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessRequestCreate"
      responses:
        "201":
          description: Request created, pending approval.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessRequest"
        "400":
          description: >-
            Missing field, both or neither of `target_id` and `asg_id`, `minutes` below 1, or
            `duration_too_long` (over the grant's maximum).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller is not eligible — no approval grant of theirs covers this target or group and protocol (`not_eligible`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            One open request per user, target and protocol: `duplicate_request` (a request is
            already pending), `already_granted` (a grant is active; extend it instead), or
            `not_extendable` (`extends_request_id` is not the caller's active grant).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [user]
      summary: List the caller's own access requests
      description: Every request the caller has made, in any state, newest first.
      responses:
        "200":
          description: The caller's requests.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PagedResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/AccessRequest"
  /me/access:
    get:
      tags: [user]
      summary: The caller's active grants
      description: Approved, unexpired access requests — the grants that currently let the caller connect.
      responses:
        "200":
          description: Active grants.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PagedResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/AccessRequest"
  /admin/applications/readiness:
    get:
      tags: [admin]
      summary: What application sessions still need
      description: >
        The prerequisites of application sessions (ADR 0034), each with its state and what
        to do: a guacd address (an application is drawn by guacd like a desktop), a container
        runtime the service can reach, and a browser image. The Applications page shows this
        until every check passes. Enrolling an application is never refused for it; opening
        one answers `501 protocol_unavailable` until guacd and the images are set.
      responses:
        "200":
          description: The checklist.
          content:
            application/json:
              schema:
                type: object
                required: [ready, checks]
                properties:
                  ready: { type: boolean }
                  checks:
                    type: array
                    items:
                      type: object
                      required: [key, title, ok, detail]
                      properties:
                        key: { type: string, enum: [guacd, runtime, image] }
                        title: { type: string }
                        ok: { type: boolean }
                        detail: { type: string }
        "401":
          description: Not signed in.
        "403":
          description: Not an administrator.
  /connect:
    post:
      tags: [user]
      summary: Request a connect ticket
      description: |
        Server-side policy evaluation happens here: role, group membership, the grants that
        cover the target and protocol, their time windows, and their MFA requirement. On success
        a one-time ticket is returned; the `access_sessions` row is created when it is redeemed. The ticket must be presented to the
        returned `ws_path` within `expires_at` (30 seconds), from the same address and with the
        same sign-in's cookie (a browser sends it with the upgrade), and is spent by its first use,
        right or wrong. The policies are applied again at that moment, so a revocation in between
        refuses the upgrade (`403 policy_denied`). Credentials supplied in the body are held in
        memory only for the life of the ticket. When every
        grant that gives the caller this target is an approval grant (ADR 0018), the caller needs
        an active grant: without one the request is refused with `403 approval_required` and the
        UI offers to request access instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectRequest"
      responses:
        "200":
          description: Ticket issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectTicket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: >-
            Denied by role, policy, time window, or CSRF check; or, when the target is reachable
            only through approval grants and the caller holds no active grant,
            `approval_required` (ADR 0018).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The target is not reachable for this protocol (capability missing, host key untrusted or changed, or instance no longer healthy).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >-
            `credential_required`: the target uses the caller's own account for this protocol, or
            every grant that admits the caller says `sign_in: own`, so the request must carry
            `credential` (a private key is for `ssh` only).
            `credential_invalid`: the private key cannot be read, is too large, or is encrypted and
            its passphrase is missing or wrong.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: >-
            The gateway cannot broker this here: `protocol_unavailable`, `engine_unavailable`, or
            `credential_mode_unavailable`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /me/sessions:
    get:
      tags: [user]
      summary: The caller's own session history
      description: Metadata only. Recording identifiers are not included.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: open
          in: query
          schema:
            type: boolean
          description: "`true` returns only sessions still open."
      responses:
        "200":
          description: Sessions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PagedResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/OwnSession"
        "400":
          $ref: "#/components/responses/BadRequest"
  /sessions/{id}/failover:
    post:
      tags: [user]
      summary: Switch to another healthy instance after target loss
      description: |
        Valid only when the session belongs to the caller, was opened against an autoscaling
        instance, and ended with `end_reason=target_lost`. Creates a new session with
        `failover_from_session_id` set to `{id}`, re-evaluates policy, and returns a fresh ticket.
        The chosen instance must currently be in the healthy pool.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asg_instance_id]
              properties:
                asg_instance_id:
                  type: string
                credential:
                  $ref: "#/components/schemas/UserSuppliedCredential"
      responses:
        "201":
          description: Ticket for the replacement session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectTicket"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The session did not end with `target_lost`, or the chosen instance is not healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /sessions/{id}/files:
    get:
      tags: [user]
      summary: List a folder on the machine of a live terminal session
      description: |
        File transfer over the SSH connection of the caller's own open terminal session (ADR
        0016). Works only while the session is open, only for its owner, and only when the
        policy that allowed it permits file transfer; otherwise `404`. Without `path`, lists the
        login folder. Entries are folders first, then by name.
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: path
          in: query
          description: The folder to list. Leave it out for the login folder.
          schema:
            type: string
      responses:
        "200":
          description: The folder and its entries.
          content:
            application/json:
              schema:
                type: object
                required: [path, entries]
                properties:
                  path:
                    type: string
                    description: The folder that was listed.
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/FileEntry"
        "400":
          description: The machine refused the request (no such folder, no permission); `code` is `sftp_error`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No open file-transfer session with this id for the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The machine's SSH server does not offer file transfer; `code` is `sftp_unavailable`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sessions/{id}/files/content:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: path
        in: query
        required: true
        description: The file on the machine.
        schema:
          type: string
    get:
      tags: [user]
      summary: Download a file from the machine of a live terminal session
      description: |
        Same conditions as `GET /sessions/{id}/files`. The file is sent as an attachment named
        after the file. Audited as `file.download` with the path and byte count; the contents
        are not recorded.
      responses:
        "200":
          description: "The file, with `Content-Disposition: attachment`."
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: "`path` is missing, or the machine refused to open the file (`sftp_error`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No open file-transfer session with this id for the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The machine's SSH server does not offer file transfer; `code` is `sftp_unavailable`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [user]
      summary: Upload a file to the machine of a live terminal session
      description: |
        Same conditions as `GET /sessions/{id}/files`. The request body is the raw file; it is
        written to `path`, replacing any file already there. Audited as `file.upload` with the
        path and byte count; the contents are not recorded.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Written.
          content:
            application/json:
              schema:
                type: object
                required: [path, bytes]
                properties:
                  path:
                    type: string
                  bytes:
                    type: integer
                    format: int64
                    description: Bytes written.
        "400":
          description: "`path` is missing, or the machine refused the write (`sftp_error`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No open file-transfer session with this id for the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The machine's SSH server does not offer file transfer; `code` is `sftp_unavailable`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ------------------------------------------------------------------ websocket
  /ws/terminal:
    servers:
      - url: /
    get:
      tags: [websocket]
      summary: SSH terminal transport
      description: |
        Served at the root, not under `/api/v1`. For SSH; WinRM uses `/ws/winrm` and databases
        `/ws/database`. The browser opens `wss://<host>/ws/terminal?ticket=<ticket>`. The server
        redeems the ticket (it is invalid after first use), prepares the credential, checks the
        `Origin` header, upgrades, and then dials the target with its trusted host key. Idle and
        maximum-duration limits from the policy are enforced here.

        Frames: the browser sends keystrokes as binary frames or as text `{"t":"i","d":"..."}`,
        a resize as `{"t":"r","c":cols,"r":rows}` and a keep-alive as `{"t":"p"}`. The server
        sends terminal output as binary frames, `{"t":"ready","session_id":"...","files":bool}`
        when the session starts (`files` is true when the policy allows file transfer through
        `/api/v1/sessions/{id}/files`), and `{"t":"end","reason":"...","msg":"..."}` when it
        ends. `reason` is an end reason such as `user_exit`, `admin_terminated`,
        `policy_revoked`, `trust_lost`, `gateway_restart` or `target_lost`; after `target_lost` on an
        autoscaling instance the browser may call `POST /sessions/{id}/failover`. If the dial
        fails after the upgrade, the socket closes with a message such as
        `host key mismatch; connection refused`. Just before the dial the target's address is
        looked up once and checked against the addresses the gateway never connects to (see
        `TargetWrite.address`), and the gateway dials the address it checked, not the name. A
        refused address closes the socket the same way, with a message saying so, and is audited
        as a failed `session.connect` with reason `address_forbidden`.
      parameters:
        - $ref: "#/components/parameters/Ticket"
        - name: cols
          in: query
          description: Initial terminal width in columns.
          schema:
            type: integer
        - name: rows
          in: query
          description: Initial terminal height in rows.
          schema:
            type: integer
      security: []
      responses:
        "101":
          description: Switching protocols.
        "401":
          description: Ticket missing, expired, or already used.
        "403":
          description: >-
            Origin mismatch, or the certificate authority does not issue certificates for the
            login user (`login_user_not_permitted`). The policies are checked again at redemption, up to thirty seconds after the ticket was issued: `policy_denied`, `mfa_required_by_policy` or `approval_required` as on `/connect`, and `review_only` when the account no longer holds the `user` or `admin` role.
        "409":
          description: The target is no longer available (`target_unavailable`) or the credential could not be opened or issued (`credential_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The gateway is restarting; `code` is `restarting`.
  /ws/desktop:
    servers:
      - url: /
    get:
      tags: [websocket]
      summary: Desktop transport (RDP, VNC)
      description: |
        Served at the root, not under `/api/v1`. Same ticket handshake as `/ws/terminal`. The
        server speaks the Guacamole protocol to guacd on a private network and relays instructions
        to the browser, which renders them with guacamole-common-js. Clipboard and file transfer
        instructions are dropped unless the policy allows them. When the gateway ends the session it
        sends a Guacamole `error` instruction whose message says why, then `disconnect`, then a
        normal close: status 519 when the target was lost (on an autoscaling group the console then
        offers another instance), 523 (session closed) for any other end the gateway decided, such
        as an administrator's terminate, a policy change, a restart or a time limit.
      parameters:
        - $ref: "#/components/parameters/Ticket"
      security: []
      responses:
        "101":
          description: Switching protocols.
        "401":
          description: Ticket missing, expired, or already used.
        "403":
          description: >-
            Origin mismatch. The policies are checked again at redemption, up to thirty seconds after the ticket was issued: `policy_denied`, `mfa_required_by_policy` or `approval_required` as on `/connect`, and `review_only` when the account no longer holds the `user` or `admin` role.
        "409":
          description: >-
            The target is no longer available or its name does not resolve
            (`target_unavailable`), its credential could not be opened (`credential_unavailable`),
            or the RDP certificate no longer matches the pin (`certificate_mismatch`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >-
            The target's address, looked up before guacd is asked to connect, is one the gateway
            never connects to (`address_forbidden`, see `TargetWrite.address`); audited as a
            failed `session.connect`. guacd is handed the name and looks it up again itself.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /ws/winrm:
    servers:
      - url: /
    get:
      tags: [websocket]
      summary: Windows PowerShell console transport (WinRM)
      description: |
        Served at the root, not under `/api/v1`. Same ticket handshake as `/ws/terminal`, for a
        ticket issued for `winrm`. Connects to the machine over HTTPS only, pinned to the
        certificate the probe captured, and runs a line-by-line PowerShell console rather than
        a full terminal: the gateway echoes and edits the line and sends it when Enter is
        pressed. Frames: the browser sends keystrokes as binary frames or as text
        `{"t":"i","d":"..."}`, a resize as `{"t":"r","c":cols,"r":rows}` and a keep-alive as
        `{"t":"p"}`; the server sends output as binary frames, `{"t":"ready","session_id":"..."}`
        when the session starts and `{"t":"end","reason":"...","msg":"..."}` when it ends.
        A resize is accepted and ignored. The session is recorded as asciicast, and the policy's
        idle and maximum durations apply.
      parameters:
        - $ref: "#/components/parameters/Ticket"
        - name: cols
          in: query
          description: Terminal width in columns, written to the recording.
          schema:
            type: integer
        - name: rows
          in: query
          description: Terminal height in rows, written to the recording.
          schema:
            type: integer
      security: []
      responses:
        "101":
          description: Switching protocols.
        "400":
          description: The ticket was not issued for `winrm`.
        "401":
          description: Ticket missing, expired, or already used.
        "403":
          description: >-
            Origin mismatch. The policies are checked again at redemption, up to thirty seconds after the ticket was issued: `policy_denied`, `mfa_required_by_policy` or `approval_required` as on `/connect`, and `review_only` when the account no longer holds the `user` or `admin` role.
        "409":
          description: |
            The connection could not be made before the upgrade. `code` says why:
            `target_unavailable`, `credential_unavailable`, `certificate_unpinned` (probe the
            machine over HTTPS first), `certificate_mismatch`, or `not_authorized` (the account
            must be a local administrator on the machine).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >-
            The target's address is one the gateway never connects to (`address_forbidden`, see
            `TargetWrite.address`); audited as a failed `session.connect`. Otherwise the client
            connects to the address it checked, while the URL and the TLS server name keep the
            target's name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The gateway is restarting; `code` is `restarting`.
  /ws/database:
    servers:
      - url: /
    get:
      tags: [websocket]
      summary: Database console transport
      description: |
        Served at the root, not under `/api/v1`. Same ticket handshake as `/ws/terminal`, for a
        ticket issued for `database` (ADR 0017). The gateway starts the database's own command
        line client, matched to the target's engine and version, in a short-lived container that
        reaches the database through a proxy holding the credential; the credential never
        reaches the client the user types into. Frames: the browser sends keystrokes as binary
        frames or as text `{"t":"i","d":"..."}`, a resize as `{"t":"r","c":cols,"r":rows}` and a keep-alive as
        `{"t":"p"}`; the server sends output as binary frames, `{"t":"ready","session_id":"..."}`
        when the session starts and `{"t":"end","reason":"...","msg":"..."}` when it ends.
        The session is recorded as asciicast, and the policy's idle and maximum durations apply.
      parameters:
        - $ref: "#/components/parameters/Ticket"
        - name: cols
          in: query
          description: Terminal width in columns.
          schema:
            type: integer
        - name: rows
          in: query
          description: Terminal height in rows.
          schema:
            type: integer
      security: []
      responses:
        "101":
          description: Switching protocols.
        "401":
          description: Ticket missing, expired, or already used.
        "403":
          description: >-
            Origin mismatch. The policies are checked again at redemption, up to thirty seconds after the ticket was issued: `policy_denied`, `mfa_required_by_policy` or `approval_required` as on `/connect`, and `review_only` when the account no longer holds the `user` or `admin` role.
        "409":
          description: The target is no longer available or its name does not resolve (`target_unavailable`), or its credential could not be opened (`credential_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >-
            The database's address is one the gateway never connects to (`address_forbidden`, see
            `TargetWrite.address`); audited as a failed `session.connect`, and no container starts.
            A database target is never probed, so this is where its name is first looked up. The
            proxy sidecar is still handed the name, which `verify-full` checks the certificate
            against, and looks it up again itself.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The gateway is restarting; `code` is `restarting`.
  /ws/shadow/{sessionID}:
    servers:
      - url: /
    get:
      tags: [websocket, auditor]
      summary: Watch a live session, read-only
      description: |
        Served at the root, not under `/api/v1`. For `admin` and `auditor`. Unlike the other
        transports it uses the signed-in cookie, not a ticket, and the browser's `Origin` must
        match. Every watch is audited as `session.shadow.start` and `session.shadow.end`, naming
        the watcher and the session's owner.

        Terminal sessions (SSH, WinRM): the server sends a text frame
        `{"t":"ready","replay":bool}`, then, when `replay` is true, one binary frame with the
        recent output so the screen is not blank, then the live output as binary frames.
        Anything the watcher sends is ignored. When the session ends the server sends
        `{"t":"end","reason":"session_ended"}` and closes.

        Desktop sessions (RDP, VNC): uses the `guacamole` subprotocol and joins the live
        connection in read-only mode, so the watcher sees the screen and their input is
        discarded.

        Database sessions cannot be watched. The session must be live on the gateway that
        receives the request.
      parameters:
        - name: sessionID
          in: path
          required: true
          description: The access session's `id`.
          schema:
            type: string
        - name: width
          in: query
          description: Desktop sessions only. Display width in pixels.
          schema:
            type: integer
        - name: height
          in: query
          description: Desktop sessions only. Display height in pixels.
          schema:
            type: integer
      responses:
        "101":
          description: Switching protocols.
        "400":
          description: This kind of session cannot be watched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The session is not live on this gateway (`not_live`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Could not join the desktop session (`join_failed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ------------------------------------------------------------------ admin: users
  /users:
    get:
      tags: [admin]
      summary: List users
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/UserStatus"
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/Role"
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Users.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PagedResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/User"
    post:
      tags: [admin]
      summary: Create a local user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: "`invalid_group`: a group in `group_ids` does not exist or is synced from an identity provider; nothing was created."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [admin]
      summary: Get a user
      responses:
        "200":
          description: User.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [admin]
      summary: Update a user
      description: |
        Sets the display name, email and status. A field left out keeps its current value;
        an empty `email` clears it. Roles and the password have their own
        routes: `PUT /users/{id}/roles` and `PUT /users/{id}/password`.

        Setting `status` to `active` clears `failed_logins` and `locked_until`. Disabling or
        locking a user signs them out everywhere. You cannot disable or lock your own account.

        An account its identity provider took away (`directory_removed_at` set: the user sync
        or SCIM disabled it because the person left) keeps its status while that provider
        exists, is enabled, and lists or pushes its people: a change of status answers 409
        `left_provider`, and the account is enabled again when the provider has the person
        again (ADR 0035, amended 2026-10-31). A name or email edit still applies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [admin]
      summary: Delete a user
      description: >
        Audit events referencing the user are retained; `actor_user_id` keeps the old id. An
        account that sessions or recording views name is kept for the record and cannot be
        deleted; disable it instead (`status: disabled`), which also ends its sessions.
      responses:
        "204":
          description: Deleted.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            `self`: you cannot delete yourself. `last_admin`: this is the last active admin.
            `has_history`: sessions on record keep the account; nothing was revoked or ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/{id}/roles:
    put:
      tags: [admin]
      summary: Set a user's roles
      description: >
        Replaces the user's roles with the list sent. Removing `admin` from the last active
        admin is refused. Granting a privileged role is called out in the audit event.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRolesWrite"
      responses:
        "200":
          description: The user with the new roles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: This is the last active admin; `code` is `last_admin`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/{id}/password:
    put:
      tags: [admin]
      summary: Reset a user's password
      description: >
        Sets a new password, or generates a one-time one. Either way, all of the user's login
        sessions are revoked, and by default the user must choose their own password at the
        next sign-in.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPasswordWrite"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                type: object
                required: [status, sessions_revoked, must_change_password]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  sessions_revoked:
                    type: integer
                  must_change_password:
                    type: boolean
                  initial_password:
                    type: string
                    description: Only when `generate` was true. Shown once; not stored in the clear.
        "400":
          description: The password does not meet the password policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
  /users/{id}/sessions:
    delete:
      tags: [admin]
      summary: Revoke all login sessions of a user
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: All `auth_sessions` for the user are revoked.
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{id}/mfa:
    delete:
      tags: [admin]
      summary: Reset a user's two-step sign-in
      description: |
        Removes the user's authenticator app and their recovery codes, and signs them out
        everywhere, so a session that passed two-step sign-in with the old authenticator does
        not outlive it. The user enrols again at their next sign-in if the deployment requires
        it. Audited as `user.mfa.reset`.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Reset.
          content:
            application/json:
              schema:
                type: object
                required: [status, sessions_revoked]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  sessions_revoked:
                    type: integer
        "404":
          $ref: "#/components/responses/NotFound"

  # ------------------------------------------------------------------ admin: groups
  /groups:
    get:
      tags: [admin]
      summary: List groups
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Groups.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PagedResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Group"
    post:
      tags: [admin]
      summary: Create a group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupWrite"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: "`invalid_user`: a user in `user_ids` does not exist; nothing was created."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /groups/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [admin]
      summary: Get a group with its members
      responses:
        "200":
          description: Group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [admin]
      summary: Update a group
      description: Sets the name and description. A left-out `name` keeps the current one; a left-out `description` clears it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupWrite"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [admin]
      summary: Delete a group
      description: >-
        The group leaves every policy that names it; the policies stay, and one it was the only
        subject of applies to no one until someone is added (ADR 0036). Its members' live
        sessions are re-checked once it is gone. Confirmation is the client's job.
      responses:
        "204":
          description: Deleted.
        "404":
          $ref: "#/components/responses/NotFound"
  /groups/{id}/members:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [admin]
      summary: List a group's members
      description: Ordered by username. Not paged; every member is in `items`.
      responses:
        "200":
          description: Members.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/GroupMember"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [admin]
      summary: Replace the member list
      description: >
        Sets the group's members to exactly the users sent; an empty list removes everyone.
        Audited as `group.members.update` with the users added and removed. Groups synced from
        an identity provider reject this call with `409 synced`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              properties:
                user_ids:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: The new member list, ordered by username.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/GroupMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # ------------------------------------------------------------------ admin: identity providers
  /identity-providers:
    get:
      tags: [admin]
      summary: List identity providers
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Providers with secrets omitted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PagedResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/IdentityProvider"
    post:
      tags: [admin]
      summary: Create an identity provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityProviderWrite"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityProvider"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /identity-providers/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [admin]
      summary: Get an identity provider
      responses:
        "200":
          description: Provider with secrets omitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityProvider"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [admin]
      summary: Update an identity provider
      description: >
        Replaces the name and the settings: send the whole provider, as when creating it. The
        type cannot change. A left-out `enabled` keeps its current value. Omitting a secret
        field keeps the stored value; sending an empty string clears it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityProviderWrite"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityProvider"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [admin]
      summary: Delete an identity provider
      description: Users and groups from this provider keep their rows with `idp_id` set to null and can no longer log in through it.
      responses:
        "204":
          description: Deleted.
        "404":
          $ref: "#/components/responses/NotFound"
  /identity-providers/{id}/test:
    post:
      tags: [admin]
      summary: Test connectivity to the provider
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Result of discovery (OIDC) or bind (LDAP).
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
        "404":
          $ref: "#/components/responses/NotFound"
  /identity-providers/{id}/sync:
    get:
      tags: [admin]
      summary: State of the provider's directory user sync
      description: |
        Whether the sync is on, its interval, whether a run is going now, and the last run
        since the gateway started (ADR 0035).
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The sync's state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityProviderSync"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [admin]
      summary: Run the directory user sync now
      description: |
        Lists the provider's directory while the caller waits (a Keycloak realm through its
        admin API, or an LDAP directory) and brings the accounts in line: people who joined
        get accounts, people who left are disabled and their sessions end, people who came back
        are enabled again. A run that would disable more than half the provider's accounts at
        once, or that listed no one, holds the removals back and says so in `last`;
        `apply_removals` applies the ones the size guard held. Audited as `idp.sync` under the
        caller, even when nothing changed. A run that failed still answers 200 with the error
        in `last`.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                apply_removals:
                  type: boolean
                  default: false
      responses:
        "200":
          description: The run happened; `last` says what it did.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityProviderSync"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            `sync_off`: the provider is disabled or its sync is off. `sync_running`: a run is
            going. `sync_unavailable`: the provider cannot be listed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /identity-providers/{id}/scim-token:
    post:
      tags: [admin]
      summary: Make the provider's SCIM token
      description: |
        Makes a bearer token for the provider's SCIM client and answers with it, once: only its
        hash is kept. Any earlier token stops working. Audited as `idp.scim_token`, never with the
        token.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The token, shown this once.
          content:
            application/json:
              schema:
                type: object
                required: [token, created_at, base_path]
                properties:
                  token:
                    type: string
                    description: Starts with `zscim_`.
                  created_at:
                    $ref: "#/components/schemas/Timestamp"
                  base_path:
                    type: string
                    description: "`/api/v1/scim/{id}`, to give the provider with this gateway's origin."
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [admin]
      summary: Revoke the provider's SCIM token
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Revoked; the provider's SCIM client is refused until a new token is made.
        "404":
          $ref: "#/components/responses/NotFound"

  # ------------------------------------------------------------------ scim
  /scim/{idp}/ServiceProviderConfig:
    get:
      tags: [scim]
      summary: What this SCIM service supports
      description: PATCH and filtering (`eq` on `userName`, `externalId`, `id`); no bulk, sort, ETags or password changes.
      security:
        - scimBearer: []
      parameters:
        - $ref: "#/components/parameters/ScimIdp"
      responses:
        "200":
          description: The service provider configuration.
          content:
            application/scim+json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/ScimError"
  /scim/{idp}/ResourceTypes:
    get:
      tags: [scim]
      summary: The resource types provisioned (User)
      security:
        - scimBearer: []
      parameters:
        - $ref: "#/components/parameters/ScimIdp"
      responses:
        "200":
          description: A list response holding the User resource type.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
  /scim/{idp}/ResourceTypes/{name}:
    get:
      tags: [scim]
      summary: One resource type
      security:
        - scimBearer: []
      parameters:
        - $ref: "#/components/parameters/ScimIdp"
        - name: name
          in: path
          required: true
          schema:
            type: string
            enum: [User]
      responses:
        "200":
          description: The resource type.
          content:
            application/scim+json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/ScimError"
  /scim/{idp}/Schemas:
    get:
      tags: [scim]
      summary: The schemas provisioned (the core User schema)
      security:
        - scimBearer: []
      parameters:
        - $ref: "#/components/parameters/ScimIdp"
      responses:
        "200":
          description: A list response holding the User schema.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
  /scim/{idp}/Schemas/{uri}:
    get:
      tags: [scim]
      summary: One schema
      security:
        - scimBearer: []
      parameters:
        - $ref: "#/components/parameters/ScimIdp"
        - name: uri
          in: path
          required: true
          schema:
            type: string
            enum: ["urn:ietf:params:scim:schemas:core:2.0:User"]
      responses:
        "200":
          description: The schema.
          content:
            application/scim+json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/ScimError"
  /scim/{idp}/Users:
    get:
      tags: [scim]
      summary: List or find the people this provider provisions
      description: |
        Only accounts linked to this provider and not deleted over SCIM. A client finds a person
        before creating them with `filter=userName eq "..."` (any case), or `externalId eq` /
        `id eq`; any other filter is `400 invalidFilter`. Paged by `startIndex` (from 1) and
        `count` (at most 200).
      security:
        - scimBearer: []
      parameters:
        - $ref: "#/components/parameters/ScimIdp"
        - name: filter
          in: query
          schema:
            type: string
        - name: startIndex
          in: query
          schema:
            type: integer
            minimum: 1
        - name: count
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 200
      responses:
        "200":
          description: A page of users.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
        "400":
          $ref: "#/components/responses/ScimError"
        "401":
          $ref: "#/components/responses/ScimError"
    post:
      tags: [scim]
      summary: Provision a person
      description: |
        `userName` is the Zanskar username (a plain name or an email address) and must equal the
        username claim the provider asserts at sign-in: the first sign-in binds its subject to this
        account. An account an administrator made with no password under that name is taken over
        with its roles; one with a password, another provider's, or one this provider already has
        is `409 uniqueness`; a new person gets the provider's default roles when the provider
        creates accounts (otherwise `403`). A person this provider deleted before comes back as the
        same account. `active: false` creates the account disabled. A `password` is ignored.
      security:
        - scimBearer: []
      parameters:
        - $ref: "#/components/parameters/ScimIdp"
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimUser"
      responses:
        "201":
          description: Provisioned.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "400":
          $ref: "#/components/responses/ScimError"
        "403":
          $ref: "#/components/responses/ScimError"
        "409":
          $ref: "#/components/responses/ScimError"
  /scim/{idp}/Users/{id}:
    get:
      tags: [scim]
      summary: One provisioned person
      security:
        - scimBearer: []
      parameters:
        - $ref: "#/components/parameters/ScimIdp"
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The user.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "404":
          $ref: "#/components/responses/ScimError"
    put:
      tags: [scim]
      summary: Replace a person's attributes
      description: |
        A changed `userName` renames the account. `active: false` disables it, marks it as the
        provider's doing and ends its browser and live sessions; `active: true` enables an account
        the provider disabled (never one an administrator disabled). The last active administrator
        is never disabled (`409 mutability`).
      security:
        - scimBearer: []
      parameters:
        - $ref: "#/components/parameters/ScimIdp"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimUser"
      responses:
        "200":
          description: The user as it now stands.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "400":
          $ref: "#/components/responses/ScimError"
        "404":
          $ref: "#/components/responses/ScimError"
        "409":
          $ref: "#/components/responses/ScimError"
    patch:
      tags: [scim]
      summary: Change some of a person's attributes
      description: |
        A PatchOp: `add`, `replace` or `remove` in any case, with a path (`active`, `userName`,
        `displayName`, `name.givenName`, `emails[type eq "work"].value`, ...) or an object of
        attributes. Booleans may be strings (`"False"`). Attributes Zanskar keeps nothing of are
        accepted and ignored. The effects are those of PUT.
      security:
        - scimBearer: []
      parameters:
        - $ref: "#/components/parameters/ScimIdp"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimPatchOp"
      responses:
        "200":
          description: The user as it now stands.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "400":
          $ref: "#/components/responses/ScimError"
        "404":
          $ref: "#/components/responses/ScimError"
        "409":
          $ref: "#/components/responses/ScimError"
    delete:
      tags: [scim]
      summary: Deprovision a person
      description: |
        Disables the account and ends its sessions, as `active: false` does, and hides it from this
        provider (404 from then on). The account and its history stay; nothing is deleted.
      security:
        - scimBearer: []
      parameters:
        - $ref: "#/components/parameters/ScimIdp"
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deprovisioned.
        "404":
          $ref: "#/components/responses/ScimError"
        "409":
          $ref: "#/components/responses/ScimError"

  # ------------------------------------------------------------------ admin: credentials
  /credentials:
    get:
      tags: [admin]
      summary: List credentials
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/CredentialType"
        - name: mode
          in: query
          schema:
            $ref: "#/components/schemas/CredentialMode"
      responses:
        "200":
          description: Credentials, secrets omitted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PagedResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Credential"
    post:
      tags: [admin]
      summary: Create a credential
      description: |
        For `ssh_key` and `ssh_ca` with `mode=vaulted`, either send `private_key` or omit it to
        have Zanskar generate an ed25519 key. The public half is returned in `public_key`. For
        `ec2_instance_connect` no secret is stored; the instance's IAM role is used. For
        `ssh_ca` the username is optional: blank means each user logs in as their own Zanskar
        username (ADR 0022).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialWrite"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /credentials/generate-ssh-key:
    post:
      tags: [admin]
      summary: Create an SSH key credential with a new key
      description: |
        Generates a new ed25519 key pair, stores the private half sealed as a vaulted `ssh_key`
        credential, and returns the credential with its `public_key` to place in the machine's
        `authorized_keys`. The private key is never returned. Audited as `credential.create`
        with `generated_key: true`. The same result is reached by `POST /credentials` with
        `type=ssh_key`, `mode=vaulted` and no `private_key`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, username]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                username:
                  type: string
                  description: The login name on the machine.
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /credentials/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [admin]
      summary: Get a credential
      responses:
        "200":
          description: Credential, secret omitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [admin]
      summary: Update a credential (same as PATCH)
      description: >
        Sending a new secret sets `rotated_at`, except for `ssh_ca`, where a key in the body
        is refused: an authority is rotated through `/credentials/{id}/rotate` in two steps.
        `type` and `mode` are immutable. Fields left out keep their value; for `ssh_ca`,
        `username: ""` clears the fixed login user and `certificate_principals: []` clears the
        allowlist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialWrite"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [admin]
      summary: Update a credential
      description: >
        Sending a new secret sets `rotated_at`, except for `ssh_ca`, where a key in the body
        is refused: an authority is rotated through `/credentials/{id}/rotate` in two steps.
        `type` and `mode` are immutable. Fields left out keep their value; for `ssh_ca`,
        `username: ""` clears the fixed login user and `certificate_principals: []` clears the
        allowlist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialWrite"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [admin]
      summary: Delete a credential
      description: Rejected with 409 while any target or autoscaling group still references it.
      responses:
        "204":
          description: Deleted.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # ------------------------------------------------------------------ admin: targets
  /targets:
    get:
      tags: [admin]
      summary: List static targets
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: kind
          in: query
          schema:
            type: string
            enum: [host, database, application]
          description: Only hosts, only database targets (ADR 0017), or only applications (ADR 0034).
        - name: os_family
          in: query
          schema:
            $ref: "#/components/schemas/OsFamily"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ActiveStatus"
        - name: attention
          in: query
          description: When `true`, only active targets waiting on an administrator's decision (a host key pending or changed, or a certificate pin pending), as the dashboard's "Hosts needing attention" counts them.
          schema:
            type: boolean
        - name: tag
          in: query
          description: "`key=value`, repeatable."
          schema:
            type: array
            items:
              type: string
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Targets.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PagedResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Target"
    post:
      tags: [admin]
      summary: Create a static target
      description: Creating does not probe. Call `/targets/{id}/probe` afterwards, or set `capabilities` by hand.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetWrite"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Target"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: >-
            The address is an IP the gateway never connects to (`address_forbidden`); see
            `TargetWrite.address`. Nothing is saved, and the refusal is audited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /targets/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [admin]
      summary: Get a target
      responses:
        "200":
          description: Target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Target"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [admin]
      summary: Update a target
      description: >
        Replaces the whole target: send every field, as when creating it, including
        `credentials`. A left-out field is cleared, and a field the write schema does not list
        (such as `id`) is rejected. Changing `address` resets `host_key_status` to `unknown` and
        clears fingerprints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetWrite"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Target"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >-
            The address is an IP the gateway never connects to (`address_forbidden`); see
            `TargetWrite.address`. Nothing is saved, and the refusal is audited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [admin]
      summary: Delete a target
      description: |
        Retires the target (ADR 0019): it leaves every listing and lookup and its credential
        bindings are dropped, but the row stays so past sessions, recordings and audit events
        keep its name. In the same transaction (ADR 0036, amended 2026-10-30) it leaves every
        grant that names it: a grant left naming nothing and matching no tag goes, and a
        policy left with no grant stays and grants nobody. Its pending and approved access
        requests are revoked, and its live sessions end (`target_deleted`). Until 1.9.0 this
        was refused with `409 in_use` while a policy named the target. `GET …/usage` previews
        it. `target.delete` names the policies changed; each gets a `policy.update`.
      responses:
        "204":
          description: Retired.
        "404":
          $ref: "#/components/responses/NotFound"
  /targets/{id}/usage:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [admin]
      summary: Preview what deleting a target changes
      description: The policies that name it and what deleting it does to each, its live sessions and its open access requests. Nothing is changed.
      responses:
        "200":
          description: Usage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetUsage"
        "404":
          $ref: "#/components/responses/NotFound"
  /targets/{id}/credentials/{protocol}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: protocol
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Protocol"
    put:
      tags: [admin]
      summary: Bind a credential to one protocol slot
      description: >
        Sets what the target presents for the protocol. Audited as `target.credential.set`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential_id]
              properties:
                credential_id:
                  type: string
                  description: >
                    A vaulted credential's id, or `user_supplied` to have the user asked for
                    their own username and password at connect time (ADR 0005 user_supplied
                    mode). The shared prompt credential is created on first use and its id is
                    what the target then carries.
      responses:
        "200":
          description: The target with its bindings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Target"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          description: The credential does not exist; `code` is `bad_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [admin]
      summary: Clear a protocol slot
      description: Audited as `target.credential.unset`.
      responses:
        "204":
          description: Cleared.
        "404":
          $ref: "#/components/responses/NotFound"
  /credentials/{id}/rotate:
    post:
      tags: [admin]
      summary: Rotate a credential
      description: >
        Replaces the secret in place for passwords, domain accounts and SSH keys (omit the key
        for `ssh_key` to have one generated). For an `ssh_ca` credential this **prepares the
        next authority key** instead (ADR 0022): it is generated unless `private_key` is sent,
        sealed beside the signing key, and returned as `rotation.pending_public_key` so targets
        can be told to trust both. Sessions keep using the current key until the cut-over.
        Audited as `credential.rotate` or `credential.rotate.prepare`.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialWrite"
      responses:
        "200":
          description: The credential; for an authority, with `rotation` set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "409":
          description: A next key is already prepared (`rotation_pending`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [admin]
      summary: Discard a prepared authority key
      description: Destroys the prepared next key of an `ssh_ca` credential. Audited as `credential.rotate.cancel`.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "409":
          description: Nothing is prepared (`no_rotation`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /credentials/{id}/rotate/cut-over:
    post:
      tags: [admin]
      summary: Cut over to the prepared authority key
      description: >
        The prepared key becomes the signing key for every session from now on; the old
        private key is destroyed and its public key is kept as `rotation.retired_public_key`
        until the administrator confirms it was removed from targets. A target that does not
        trust the new key yet refuses logins, so test bound targets first. Audited as
        `credential.rotate` with both fingerprints.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The credential after the cut-over.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "409":
          description: Nothing is prepared (`no_rotation`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /credentials/{id}/rotate/retire:
    post:
      tags: [admin]
      summary: Confirm the retired authority key was removed from targets
      description: Clears `rotation.retired_public_key`. Zanskar cannot verify the removal. Audited as `credential.rotate.retire`.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "409":
          description: Nothing is retired (`no_rotation`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /targets/{id}/probe:
    post:
      tags: [admin]
      summary: Probe a target
      description: |
        Connects to each configured port from the gateway, records reachable protocols in
        `capabilities`, and captures the SSH host key fingerprint and the RDP or WinRM TLS
        certificate fingerprint. A new SSH fingerprint on a target whose status was `trusted`
        sets `host_key_status=changed` and blocks SSH connects until an admin trusts it again.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Probe result. The target row is updated in the same transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >-
            The address, or an address its name resolves to, is one the gateway never connects
            to (`address_forbidden`); see `TargetWrite.address`. Nothing is dialled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: >-
            The target's name could not be resolved, or resolved to no address (`probe_failed`).
            Ports that do not answer are not an error here: the result reports each one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /targets/{id}/probe-certificate:
    post:
      tags: [admin]
      summary: Test a certificate login
      description: >
        Signs in to the target once with a certificate minted by the authority bound to its
        SSH slot, then disconnects: does the target trust that authority? With `key=pending`
        the prepared next key is used, to check targets before a cut-over. It is a real login
        (the target's auth log shows the key id `zanskar-probe:<admin>:<login user>`), so it
        needs a trusted host key, an `ssh_ca` credential on the slot, and a login user the
        authority permits. Audited as `target.probe.certificate`.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                  enum: [current, pending]
                  default: current
      responses:
        "200":
          description: "The outcome; `accepted: false` with a `reason` is an answer, not an error."
          content:
            application/json:
              schema:
                type: object
                required: [accepted, key, login_user]
                properties:
                  accepted:
                    type: boolean
                  key:
                    type: string
                    enum: [current, pending]
                  login_user:
                    type: string
                  reason:
                    type: string
                    enum: [certificate_rejected, host_key_mismatch, unreachable]
                  error:
                    type: string
        "403":
          description: The authority does not issue for the login user (`login_user_not_permitted`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`host_key_untrusted`, `no_credential`, `not_certificate_authority` or `no_rotation`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >-
            The address, or an address its name resolves to, is one the gateway never connects
            to (`address_forbidden`); a name that does not resolve is answered the same way. No
            login is attempted. Otherwise the login goes to the address that was checked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /targets/{id}/host-key/trust:
    post:
      tags: [admin]
      summary: Trust the currently recorded host key
      description: |
        Moves `host_key_status` from `pending` or `changed` to `trusted`. The request must echo
        the fingerprint it is trusting so a probe that races with this call cannot be approved
        by accident. Audited as `target.host_key.trust`.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host_key_fingerprint]
              properties:
                host_key_fingerprint:
                  type: string
                  examples: ["SHA256:2Hm1kWm2v8lQ3o1n9p7Q9xL0Z2c5s8f1a4d7g0j3k6m"]
      responses:
        "200":
          description: Trusted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Target"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Fingerprint in the body does not match the recorded one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /targets/{id}/certificate/trust:
    post:
      tags: [admin]
      summary: Accept the RDP or WinRM certificate awaiting confirmation
      description: |
        Pins the certificate a probe held as pending (`tls_fingerprint_pending` or
        `winrm_tls_fingerprint_pending`) for that protocol and clears the pending one. The
        request must echo the fingerprint it is accepting, so a probe racing this call cannot
        get a different certificate pinned. Audited as `target.tls.trust`, refusals included.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [protocol, fingerprint]
              properties:
                protocol:
                  type: string
                  enum: [rdp, winrm]
                fingerprint:
                  type: string
      responses:
        "200":
          description: Accepted; the target as stored now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Target"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            `fingerprint_mismatch`: the fingerprint is not the one awaiting confirmation;
            `no_pending_certificate`: nothing awaits confirmation for that protocol.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ------------------------------------------------------------------ admin: access policies
  /access-policies:
    get:
      tags: [admin]
      summary: List access policies
      description: >-
        Every policy, in name order, a page at a time. There is no filter: the list is small,
        and the console filters it itself.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Policies.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PagedResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/AccessPolicy"
    post:
      tags: [admin]
      summary: Create an access policy
      description: >-
        Grants carry no `id`; the server makes one for each. The live sessions of everyone the
        policy names are re-checked at once: a new grant never loosens a term of access someone
        already holds, but it can tighten one (its clipboard off where theirs was on), and a
        session it now refuses ends with `policy_revoked`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessPolicyWrite"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessPolicy"
        "400":
          $ref: "#/components/responses/PolicyBadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/PolicyUnprocessable"
  /access-policies/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [admin]
      summary: Get an access policy
      responses:
        "200":
          description: Policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessPolicy"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [admin]
      summary: Update an access policy
      description: >-
        Replaces the whole policy, subjects and grants included: read it, change it, and send all
        of it back, each kept grant with its `id`. A grant left out is removed; one without an
        `id` is new. A left-out switch takes its default, not its current value (see
        `PolicyGrant`). The live sessions of everyone the policy named before or names now are
        checked against the saved policies at once, and those no longer granted end with
        `policy_revoked`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessPolicyWrite"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessPolicy"
        "400":
          $ref: "#/components/responses/PolicyBadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/PolicyUnprocessable"
    delete:
      tags: [admin]
      summary: Delete an access policy
      description: >-
        The live sessions of everyone the policy named are checked against the policies left,
        and those no longer granted end with `policy_revoked`.
      responses:
        "204":
          description: Deleted.
        "404":
          $ref: "#/components/responses/NotFound"

  /access-requests:
    get:
      tags: [admin]
      summary: List access requests
      description: The approval queue and its history. Filter by `status` to show, for example, only what is pending.
      parameters:
        - name: status
          in: query
          description: Restrict to one lifecycle state.
          schema:
            $ref: "#/components/schemas/AccessRequestStatus"
      responses:
        "200":
          description: Access requests, newest first (up to 500).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PagedResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/AccessRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
  /access-requests/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [admin]
      summary: Approve a pending request
      description: >-
        Turns a pending request into a time-bounded grant. Eligibility and the duration cap are
        taken from the requester's policies as they stand at approval, not as they stood at the
        request. The grant expires `requested_minutes` after approval; a background sweeper then
        marks it `expired`, `/connect` stops issuing tickets for it, and the sessions the grant
        admitted end as `max_duration` unless standing access still covers them.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessDecision"
      responses:
        "200":
          description: >-
            Approved; `status` is `approved`, `approved_minutes` and `expires_at` are set. An
            extension's `expires_at` runs on from the grant it extends while that grant is active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessRequest"
        "400":
          description: "`minutes` below 1, or the granted duration over the approval grant's current maximum (`duration_too_long`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            The request is not pending (`conflict`), or no approval grant of the requester's
            covers the target and protocol any more (`not_eligible`); the request stays pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /access-requests/{id}/deny:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [admin]
      summary: Deny a pending request
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessDecision"
      responses:
        "200":
          description: Denied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The request is not pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /access-requests/{id}/revoke:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [admin]
      summary: Revoke an active grant
      description: Ends an approved grant early. `/connect` stops issuing tickets for it at once, and the sessions the grant admitted end as `policy_revoked` unless standing access still covers them; the audit event counts them as `live_sessions_ended`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessDecision"
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The request is not an approved grant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ------------------------------------------------------------------ admin: autoscaling groups
  /autoscaling-groups:
    get:
      tags: [admin]
      summary: List autoscaling groups
      description: >
        Every group that has not been un-enrolled, active or not, ordered by name. Not paged:
        every group is in `items`, and there is no `next_cursor`.
      responses:
        "200":
          description: Groups.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AutoscalingGroupListed"
    post:
      tags: [admin]
      summary: Enroll an autoscaling group
      description: |
        Zanskar generates `external_id` unless one minted by `POST /autoscaling-groups/iam-preview`
        is sent back. The IAM trust and permissions policies for the role are not in the response;
        read them from `GET /autoscaling-groups/{id}/iam`. The first sync runs on creation; check
        `last_error`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoscalingGroupWrite"
      responses:
        "201":
          description: Enrolled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoscalingGroup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /autoscaling-groups/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [admin]
      summary: Get an autoscaling group
      description: The IAM policy documents for the role are at `GET /autoscaling-groups/{id}/iam`.
      responses:
        "200":
          description: Group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoscalingGroup"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [admin]
      summary: Update an autoscaling group
      description: >
        Replaces the whole group: send every field, as when creating it. `provider` and
        `external_id` are ignored here. To issue a new external id, send
        `rotate_external_id: true`; the gateway cannot assume the role again until its trust
        policy is updated with the new id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoscalingGroupWrite"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoscalingGroup"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [admin]
      summary: Un-enroll an autoscaling group
      description: |
        Retires the group (ADR 0019): it leaves every listing and the sync loop and its
        credential bindings are dropped, but the group and its instance rows stay so past
        sessions keep their names. In the same transaction (ADR 0036, amended 2026-10-30) it
        leaves every autoscaling grant that names it, as a deleted target does; its open access
        requests are revoked and the sessions on its instances end (`target_deleted`). Until
        1.9.0 this was refused with `409 in_use`. `GET …/usage` previews it.
      responses:
        "204":
          description: Retired.
        "404":
          $ref: "#/components/responses/NotFound"
  /autoscaling-groups/{id}/usage:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [admin]
      summary: Preview what deleting an autoscaling group changes
      description: The policies that name it and what deleting it does to each, the live sessions on its instances and its open access requests. Nothing is changed.
      responses:
        "200":
          description: Usage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetUsage"
        "404":
          $ref: "#/components/responses/NotFound"
  /autoscaling-groups/iam-preview:
    post:
      tags: [admin]
      summary: IAM documents for a group before it is saved
      description: >
        Mints the ExternalId (or reuses one sent back) and renders everything the customer
        needs to create the cross-account role: the trust policy with this gateway's real
        principal, the permissions policy, a paste-ready AWS CLI script and a CloudFormation
        template (ADR 0023). When the gateway's principal is unknown the trust policy and the
        scripts are absent, never a placeholder; `principal_source` says why. Send the
        `external_id` back on create.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [region, external_name]
              properties:
                region:
                  type: string
                external_name:
                  type: string
                external_id:
                  type: string
                  description: One minted by an earlier preview, to render the same documents again.
      responses:
        "200":
          description: The documents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsgIAMDocs"
  /autoscaling-groups/test:
    post:
      tags: [admin]
      summary: Test a role before enrolling
      description: >
        Assumes the role with the ExternalId and describes the group, changing nothing. The
        answer names the failing stage: `assume` (trust policy principal or ExternalId),
        `describe` (permissions policy), `group` (no such group in that region). Audited as
        `asg.test`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [region, external_name, role_arn, external_id]
              properties:
                region:
                  type: string
                external_name:
                  type: string
                role_arn:
                  type: string
                external_id:
                  type: string
      responses:
        "200":
          description: "The outcome; `ok: false` with a `stage` is an answer, not an error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsgAccessTest"
        "501":
          description: No cloud provider is configured (`test_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /autoscaling-groups/{id}/test:
    post:
      tags: [admin]
      summary: Test a saved group's role
      description: The same test as `/autoscaling-groups/test` for a saved group.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsgAccessTest"
        "404":
          $ref: "#/components/responses/NotFound"
  /autoscaling-groups/{id}/iam:
    get:
      tags: [admin]
      summary: IAM documents for a saved group
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The documents, as for the preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsgIAMDocs"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/aws/identity:
    get:
      tags: [admin]
      summary: The AWS principal this gateway runs as
      description: >
        Detected once at start through STS GetCallerIdentity and cached, unless
        ZANSKAR_AWS_GATEWAY_PRINCIPAL overrides it (ADR 0023). An assumed-role session ARN is
        converted to the role ARN a trust policy must name.
      responses:
        "200":
          description: The identity, or source `none` with the reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwsIdentity"
  /admin/aws/identity/refresh:
    post:
      tags: [admin]
      summary: Detect the gateway's AWS principal again
      description: For a gateway that was given a role after it started. Audited as `aws.identity.refresh`.
      responses:
        "200":
          description: The identity after detection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwsIdentity"
  /autoscaling-groups/{id}/credentials/{protocol}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: protocol
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Protocol"
    put:
      tags: [admin]
      summary: Bind a credential to one protocol for a group
      description: >
        Sets the credential every instance of the group presents for the protocol, replacing
        any bound before. Audited as `asg.credential.set`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential_id]
              properties:
                credential_id:
                  type: string
                  description: >
                    A credential's id, or `user_supplied` to have the user asked for their own
                    username and password at connect time. The shared prompt credential is
                    created on first use and its id is what the group then carries.
      responses:
        "200":
          description: The group with its bindings in `credentials`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoscalingGroup"
        "400":
          description: "`credential_id` is missing, the protocol is unknown, or the credential does not exist."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [admin]
      summary: Clear a group's protocol binding
      description: Audited as `asg.credential.unset`.
      responses:
        "204":
          description: Cleared.
        "400":
          description: The protocol is unknown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
  /autoscaling-groups/{id}/sync:
    post:
      tags: [admin]
      summary: Sync now
      description: Assumes the role, lists instances and load balancer target health, runs the gateway TCP probe, and updates `asg_instances`.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Sync result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: AssumeRole or a Describe call failed. `message` contains the AWS error code, never the request signature.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /autoscaling-groups/{id}/instances:
    get:
      tags: [admin]
      summary: All known instances
      description: Includes unhealthy and recently terminated instances so admins can see churn. Users get the healthy pool only from `/me/autoscaling-groups/{id}/instances`.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: include_terminated
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Instances.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PagedResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/AsgInstance"
        "404":
          $ref: "#/components/responses/NotFound"

  # ------------------------------------------------------------------ admin: sessions
  /sessions:
    get:
      tags: [auditor]
      summary: List all access sessions
      parameters:
        - name: limit
          in: query
          description: Page size. This list allows up to 500, more than the usual 200.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - $ref: "#/components/parameters/Cursor"
        - name: user_id
          in: query
          schema:
            type: string
        - name: username
          in: query
          description: Narrow to one account by username (case-insensitive).
          schema:
            type: string
        - name: target_id
          in: query
          schema:
            type: string
        - name: open
          in: query
          description: When `true`, only sessions with no `ended_at`.
          schema:
            type: boolean
        - name: from
          in: query
          description: Only sessions started at or after this time, as the dashboards' "Sessions (24h)" counts them. A value that is not RFC 3339 is 400.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Sessions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PagedResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/AccessSession"
        "400":
          $ref: "#/components/responses/BadRequest"
  /sessions/{id}:
    get:
      tags: [auditor]
      summary: Get one access session
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessSession"
        "404":
          $ref: "#/components/responses/NotFound"
  /sessions/{id}/terminate:
    post:
      tags: [admin]
      summary: Terminate an open session
      description: >
        Ends the session with `end_reason=admin_terminated` and audits `session.terminate` with
        the optional reason. When the session is live on this gateway its WebSocket and upstream
        connection are closed and `live` is true. Otherwise (another gateway holds it, or a crash
        left it open) the session row is closed so it stops showing as open, and `live` is false.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: Terminating.
          content:
            application/json:
              schema:
                type: object
                required: [status, live]
                properties:
                  status:
                    type: string
                    enum: [terminating]
                  live:
                    type: boolean
                    description: The session was live on this gateway and its connection is being closed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Session already ended (`already_ended`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ------------------------------------------------------------------ auditor
  /audit/events:
    get:
      tags: [auditor]
      summary: Audit events
      description: Ordered by `id` descending. The cursor encodes the last seen `id`.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: actor_user_id
          in: query
          schema:
            type: string
        - name: action
          in: query
          description: Exact action or prefix ending in `.`, for example `session.`.
          schema:
            type: string
        - name: object_type
          in: query
          schema:
            type: string
        - name: object_id
          in: query
          schema:
            type: string
        - name: outcome
          in: query
          schema:
            $ref: "#/components/schemas/Outcome"
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Events.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PagedResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/AuditEvent"
  /audit/overview:
    get:
      tags: [auditor]
      summary: Counts for the auditor dashboard
      description: >
        The numbers the auditor dashboard shows (ADR 0029): open and last-24-hour session
        counts, 24-hour event tallies (total, failures, failed logins, refused connects),
        and how many recordings were viewed and downloaded in the last 24 hours. Counts
        only, never row data, so reading it records no audit event. Admins and auditors.
        Never cached.
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditOverview"
  /audit/verify:
    get:
      tags: [auditor]
      summary: Verify the audit hash chain, its anchors and the id sequence
      description: >
        Walks the whole log from the first event in id order, checking each event's link to the
        one before and recomputing its hash; the walk stops at the first break. Then checks every
        stored anchor (ADR 0008): its signature, made with a key derived from the master key, and
        that the event it names is still in the log with the hash it signed. Last it compares the
        id sequence with the newest event, which notices the newest events being deleted before
        an anchor covers them. Expect this to take seconds on large tables.
      responses:
        "200":
          description: >
            Verification result. A broken chain or a problem is still 200, with `intact=false`, the
            break in `broken` and the findings in `problems`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditVerifyResult"
  /audit/facets:
    get:
      tags: [auditor]
      summary: Values to filter the audit log by
      description: >
        The distinct `action` and `object_type` values present in the audit log, sorted, for
        the console's filter lists. Each list holds at most 200 values.
      responses:
        "200":
          description: The values.
          content:
            application/json:
              schema:
                type: object
                required: [actions, object_types]
                properties:
                  actions:
                    type: array
                    items:
                      type: string
                  object_types:
                    type: array
                    items:
                      type: string
  /recordings/{id}:
    get:
      tags: [auditor]
      summary: Get recording metadata
      description: Does not count as a view.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Recording.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recording"
        "404":
          $ref: "#/components/responses/NotFound"
  /recordings/{id}/stream:
    get:
      tags: [auditor]
      summary: Stream recording content
      description: |
        Inserts a `recording_views` row and audits `recording.view` before the first byte is sent.
        `asciicast` streams `application/x-asciicast` (asciicast v2, newline-delimited JSON).
        `guac` streams `application/octet-stream` in the Guacamole recording format for the
        guacamole-common-js player. Supports `Range` requests. The `ETag` is the recording's
        `sha256`.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Full content.
          content:
            application/x-asciicast:
              schema:
                type: string
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Partial content.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Recording is still in progress.
  /recordings/{id}/download:
    get:
      tags: [auditor]
      summary: Download the recording file
      description: |
        The same bytes as `stream`, sent as an attachment named after the user, the machine and
        the recording's short id (`alice-web-1-3fa2b1c0.cast` or `.guac`). Inserts a
        `recording_views` row and audits `recording.download` with `kind: raw` before the first
        byte, so an evidence download is as traceable as a playback.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: "The recording, with `Content-Disposition: attachment`."
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: Deleted by the retention policy (`purged`).
  /recordings/{id}/transcript:
    get:
      tags: [auditor]
      summary: Download the command transcript of a terminal recording
      description: |
        Plain text: a short header (who, where, when, recording id and SHA-256), then one line per
        command the user submitted, `HH:MM:SS  command`, taken from the recording's markers.
        Input the remote did not echo appears as `(hidden input)`; it was never stored. Audits
        `recording.download` with `kind: transcript` and inserts a `recording_views` row.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: "The transcript as `text/plain`, with `Content-Disposition: attachment`."
          content:
            text/plain:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Not a terminal recording (`not_a_terminal_recording`); download the desktop recording instead.
        "410":
          description: Deleted by the retention policy (`purged`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ------------------------------------------------------------------ admin: retention
  /system/banner:
    get:
      tags: [system]
      summary: The login banner
      description: >
        The system-use notification an administrator configured for the sign-in page, read
        before any credential is entered, so no session is required. Empty `text` means none
        is set. Never cached.
      security: []
      responses:
        "200":
          description: The banner text.
          content:
            application/json:
              schema:
                type: object
                required: [text]
                properties:
                  text:
                    type: string
  /admin/settings:
    get:
      tags: [admin]
      summary: List every setting
      description: >
        Runtime settings resolved with their precedence (built-in default, then the
        environment variable written at install, then the console value), and the boot
        settings fixed at install, with the variable to edit and secrets masked (ADR 0020);
        `editable` marks those the console may change through the root helper.
      responses:
        "200":
          description: Both sections.
          content:
            application/json:
              schema:
                type: object
                required: [runtime, boot]
                properties:
                  runtime:
                    type: array
                    items:
                      $ref: "#/components/schemas/Setting"
                  boot:
                    type: array
                    items:
                      $ref: "#/components/schemas/BootSetting"
  /admin/settings/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
        description: A runtime setting key, for example `log.level`; `login-banner` is accepted for `login_banner`.
    put:
      tags: [admin]
      summary: Set a runtime setting
      description: >
        Validates the value for the setting's type, stores it as the console value and
        applies it at once, no restart. Audited as `settings.update` with the previous and
        the new value and where the previous one came from. A boot setting is refused with
        409 and the environment variable to edit instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
      responses:
        "200":
          description: The setting as now resolved (`source` is `console`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
        "400":
          description: >
            The value does not fit the type (not true/false, not in the enum, not host:port,
            too long). For `database.proxy_image`, also when it is not an image reference: a
            lowercase `registry/repository` path, an optional `:tag` and an optional
            `@sha256:` digest of 64 hex digits, with no spaces and no leading `-`, the name at
            most 255 characters; `message` says so. The value lands in a `docker run`
            argument vector, so nothing else is accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The setting decides where a vaulted credential is sent (`desktop.guacd_addr`, `database.proxy_image`) and the session has not proved an authenticator code in the last five minutes (`step_up_required`); see `POST /auth/mfa/step-up`.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A boot setting, fixed at install; `code` is `boot_setting`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [admin]
      summary: Reset a runtime setting
      description: >
        Removes the console value so the environment variable or the built-in default
        applies again, at once. Audited as `settings.reset`.
      responses:
        "200":
          description: The setting as now resolved (`source` is `environment` or `default`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
        "403":
          description: The setting decides where a vaulted credential is sent (`desktop.guacd_addr`, `database.proxy_image`) and the session has not proved an authenticator code in the last five minutes (`step_up_required`); see `POST /auth/mfa/step-up`.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A boot setting; `code` is `boot_setting`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/settings/boot:
    post:
      tags: [admin]
      summary: Change install settings through the root helper
      description: |
        ADR 0020, amended 2026-10-30. New values for the allowlisted variables
        (`ZANSKAR_APPS_MAX_SESSIONS`, `ZANSKAR_DATABASE_MAX_SESSIONS`, `ZANSKAR_PUBLIC_URL`,
        `ZANSKAR_TLS_HOSTS`, `ZANSKAR_LOG_FORMAT`, `ZANSKAR_ISSUER`, `ZANSKAR_AWS_GATEWAY_PRINCIPAL`),
        or a TLS preset (`managed` or `proxy`, which set the mode, the listen address, the redirect
        and the proxy trust together). The gateway never writes the environment file: after the
        drain it writes a request that `zanskar config apply`, run as root by a path unit, checks
        again, writes beside the old file (kept as `env.previous`), and applies with a restart; if
        the gateway does not come back on the new file, the previous one goes back. Needs a
        systemd host and a recent authenticator code. Audited as `settings.boot_request`, and the
        outcome as `settings.boot_apply`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                values:
                  type: object
                  additionalProperties: { type: string }
                  description: Allowlisted variables and their new values; "" takes a line out.
                tls_mode:
                  type: string
                  enum: [managed, proxy]
                wait_minutes:
                  type: integer
                  minimum: 0
                  maximum: 240
      responses:
        "202":
          description: Draining; the request is written after the drain.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, description: The request; the result names it. }
                  status: { $ref: "#/components/schemas/SystemStatus" }
        "400":
          description: >-
            `invalid_change`: a variable outside the allowlist, a preset's variable given on its
            own, or a value the helper would refuse. Nothing is drained.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "`step_up_required`: prove an authenticator code first."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`unsupported_supervisor`: not a systemd host with a state directory."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/settings/boot/result:
    get:
      tags: [admin]
      summary: The root helper's last answer
      responses:
        "200":
          description: Result.
          content:
            application/json:
              schema:
                type: object
                required: [id, state, at]
                properties:
                  id: { type: string }
                  state: { type: string, enum: [applied, refused, rolled_back] }
                  message: { type: string }
                  changed: { type: array, items: { type: string }, description: Variable names only. }
                  at: { type: string, format: date-time }
                  requested_by: { type: string, description: User id of the administrator who asked. }
                  acknowledged: { type: boolean, description: The gateway has audited this outcome as `settings.boot_apply`. }
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/settings/login-banner:
    get:
      tags: [admin]
      summary: Get the login banner setting
      deprecated: true
      description: Alias of `GET /admin/settings` filtered to `login_banner`; kept for clients that used it.
      responses:
        "200":
          description: The setting, with who last changed it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
    put:
      tags: [admin]
      summary: Set the login banner
      deprecated: true
      description: >
        Alias of `PUT /admin/settings/login_banner`. Plain text shown above the sign-in form
        (a system-use notification, NIST AC-8). Trimmed, line endings unified, at most 4000
        characters; empty hides the banner. Applied at once, no restart. Audited as
        `settings.update` with the previous and the new text.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
                  maxLength: 4000
      responses:
        "200":
          description: The stored setting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
        "400":
          description: Too long or not valid UTF-8.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/logs:
    get:
      tags: [admin]
      summary: Recent log lines
      description: >
        The gateway's most recent log records from an in-memory ring (the last 2000 at the
        running log level), newest first. What the journal shows, without shell access.
      parameters:
        - name: level
          in: query
          schema:
            type: string
            enum: [debug, info, warn, error]
          description: Lowest level to return; default debug (everything captured).
        - name: q
          in: query
          schema:
            type: string
          description: Case-insensitive text to match in the message or attributes.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
          description: Default 200, at most the ring's capacity.
      responses:
        "200":
          description: The lines.
          content:
            application/json:
              schema:
                type: object
                required: [items, capacity, seen]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [time, level, msg]
                      properties:
                        time:
                          $ref: "#/components/schemas/Timestamp"
                        level:
                          type: string
                        msg:
                          type: string
                        attrs:
                          type: object
                          additionalProperties:
                            type: string
                  capacity:
                    type: integer
                  seen:
                    type: integer
                    description: Records logged since start.
  /admin/logs/download:
    get:
      tags: [admin]
      summary: Download the recent log lines
      description: The whole ring, oldest first, one JSON object per line. Audited as `logs.download`.
      responses:
        "200":
          description: The lines.
          content:
            application/x-ndjson:
              schema:
                type: string
  /admin/tls:
    get:
      tags: [admin]
      summary: The certificate the gateway serves
      description: >
        Mode (file, managed, proxy) and, when the gateway terminates TLS, the certificate
        being served plus the uploaded and generated ones on record (ADR 0021). Never a key.
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TLSStatus"
    put:
      tags: [admin]
      summary: Upload a certificate
      description: >
        PEM certificate chain and unencrypted private key. Validated (key matches, leaf in
        its validity period, server authentication allowed), stored with the key sealed, and
        served on the next connection. Audited as `tls.certificate.upload` with subject,
        names, expiry and SHA-256.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cert_pem, key_pem]
              properties:
                cert_pem:
                  type: string
                key_pem:
                  type: string
      responses:
        "200":
          description: The status after the upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TLSStatus"
        "400":
          description: The certificate or key was refused; the message says why.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Proxy mode, nothing to manage; `code` is `tls_proxy`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [admin]
      summary: Remove the uploaded certificate
      description: The file certificate or the self-signed one serves again. Audited as `tls.certificate.reset`.
      responses:
        "200":
          description: The status after the removal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TLSStatus"
        "409":
          description: Proxy mode; `code` is `tls_proxy`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/tls/self-signed:
    post:
      tags: [admin]
      summary: Regenerate the self-signed certificate
      description: >
        Makes a new self-signed certificate for the given names (default: the names the
        gateway detected at start). It serves only while no uploaded or file certificate
        takes precedence. Audited as `tls.certificate.regenerate`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                hosts:
                  type: array
                  maxItems: 32
                  items:
                    type: string
      responses:
        "200":
          description: The status after regeneration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TLSStatus"
  /admin/storage:
    get:
      tags: [admin]
      summary: Recording storage in use
      description: >
        Where new recordings go (a console-configured bucket, the environment's bucket, or the
        local directory), how many recordings each store holds, and the state of the last move
        of local recordings. Never a secret.
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageStatus"
    put:
      tags: [admin]
      summary: Store new recordings in an S3-compatible bucket
      description: >
        Validated, then probed (an object is written, read back and deleted with the given
        settings), then saved with the secret sealed and made active for the next session, no
        restart. Sending auth `keys` without a secret keeps the stored one. Audited as
        `recording.storage.update` without the secret.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageConfig"
      responses:
        "200":
          description: The status after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageStatus"
        "400":
          description: Invalid settings or a failed probe; the message says why.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [admin]
      summary: Remove the console storage setting
      description: The environment's bucket or the local directory serves again. Audited as `recording.storage.reset`.
      responses:
        "200":
          description: The status after the removal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageStatus"
  /admin/storage/test:
    post:
      tags: [admin]
      summary: Probe a bucket without saving
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageConfig"
      responses:
        "200":
          description: The probe passed.
        "400":
          description: The probe failed; the message says why.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/storage/move:
    post:
      tags: [admin]
      summary: Move local recordings to the active bucket
      description: >
        Starts a background move of every finished local recording: copied, digest checked,
        record repointed, local file removed. Recordings of running sessions are skipped. One
        move at a time; progress is in the status. Audited as `recording.storage.move` when done.
      responses:
        "202":
          description: The move started; the status shows it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageStatus"
        "400":
          description: No bucket is active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A move is already running; `code` is `move_running`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/overview:
    get:
      tags: [admin]
      summary: Counts for the admin dashboard
      description: >
        The numbers the admin dashboard shows (ADR 0029): open and last-24-hour session
        counts, how many access requests await a decision, how many targets need an
        administrator (a host key pending or changed, a certificate pin awaiting
        confirmation), and 24-hour audit tallies (failed logins, refused connects, failures
        overall). Counts only, never row data, so reading it records no audit event. Never
        cached.
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
  /admin/system/status:
    get:
      tags: [admin]
      summary: Process status
      description: >
        What the console needs to know about the running process: version, start time,
        live-session count, whether the environment file changed since start (names of the
        variables only, never values) and so a restart is required, and any restart in
        progress. Never cached.
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
  /admin/system/metrics:
    get:
      tags: [admin]
      summary: The host's numbers right now
      description: >
        Current values for the admin dashboard's gateway card: load averages and memory
        (Linux hosts; omitted elsewhere), free space on the volumes the gateway writes
        (the database file and the recordings directory, folded together when they share
        a filesystem), how many database client containers are running (one per live
        database session), and whether guacd answers at its configured address. Facts
        now, never history — time series belong to an exporter. Never cached.
      responses:
        "200":
          description: The metrics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemMetrics"
  /admin/system/host:
    get:
      tags: [admin]
      summary: What the host actions need to know
      description: >
        The hostname an administrator must type to confirm, the supervisor, whether the
        actions are available (a systemd host; ADR 0032), and whether this session proved
        an authenticator code recently enough. Never cached.
      responses:
        "200":
          description: The host status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostStatus"
  /admin/system/reboot:
    post:
      tags: [admin]
      summary: Reboot the host after draining live sessions
      description: >
        Audited as `system.reboot` before anything happens, then drains like a restart and
        runs `systemctl reboot`, which logind and polkit allow the service user (the rule
        ships with the package). Needs a recent authenticator proof on the session
        (`/auth/mfa/step-up`) and the gateway's hostname typed as confirmation. On a host
        without systemd the action is refused. A refused `systemctl` cancels the drain and is
        audited as a failure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostActionRequest"
      responses:
        "202":
          description: The drain has started; the status shows it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "400":
          description: The confirmation does not match the hostname, or wait_minutes is out of range.
        "403":
          description: No recent authenticator proof on this session (`step_up_required`).
        "409":
          description: Not a systemd host (`unsupported_supervisor`).
  /admin/system/poweroff:
    post:
      tags: [admin]
      summary: Power the host off after draining live sessions
      description: >
        As reboot, audited as `system.poweroff`, running `systemctl poweroff`. Nothing in the
        portal can start a stopped machine; recovery needs the host or the cloud console, and
        the console says so before asking for the hostname.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostActionRequest"
      responses:
        "202":
          description: The drain has started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "400":
          description: The confirmation does not match the hostname, or wait_minutes is out of range.
        "403":
          description: No recent authenticator proof on this session (`step_up_required`).
        "409":
          description: Not a systemd host (`unsupported_supervisor`).
  /admin/system/update:
    get:
      tags: [admin]
      summary: The last version check
      description: >
        Whether a newer release exists (ADR 0032): the running version, the latest the project
        site publishes, its release notes link, when it was checked, and whether the daily
        check is switched on (`updates.check`). Counts as public information; not audited.
        Never cached.
      responses:
        "200":
          description: The check.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStatus"
  /admin/system/update/install:
    post:
      tags: [admin]
      summary: Install a newer release from the console
      description: >
        Audited as `system.update` before anything happens, then drains like a restart and
        writes the wanted version to the update request file in the state directory, which
        the package's `zanskar-update.path` unit watches (ADR 0032). The root-owned
        installer fetches the release itself, verifies the cosign bundle over SHA256SUMS
        against the release workflow's identity, checks the package against those sums,
        installs it and restarts the service; its progress appears in the update status.
        Needs a recent authenticator proof (`/auth/mfa/step-up`), the hostname typed, and a
        version newer than the running one. Only on a systemd host with a state directory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, confirm]
              properties:
                version:
                  type: string
                  description: The release to install, such as 1.5.0; must be newer than the running version.
                wait_minutes:
                  type: integer
                  minimum: 0
                  maximum: 240
                  default: 15
                confirm:
                  type: string
                  description: The gateway's hostname, typed.
      responses:
        "202":
          description: The drain has started; the request is written when it ends.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "400":
          description: Not a version, a prerelease (`prerelease_refused`; the installer takes releases only), not newer (`not_newer`), hostname mismatch, or wait_minutes out of range.
        "403":
          description: No recent authenticator proof on this session (`step_up_required`).
        "409":
          description: Not a systemd host or no state directory (`unsupported_supervisor`).
  /admin/system/update/check:
    post:
      tags: [admin]
      summary: Check for a new version now
      description: Fetches the project's version manifest immediately and returns the result.
      responses:
        "200":
          description: The check.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStatus"
  /admin/system/restart:
    post:
      tags: [admin]
      summary: Restart the gateway after draining live sessions
      description: >
        Refuses new sessions at once (503 `restarting` on connect and on ticket redemption),
        waits up to `wait_minutes` for live sessions to end, ends any that remain with the
        reason `gateway_restart`, then stops serving and exits 0 for the supervisor to
        start a fresh process that reads the environment file again. A second call while a
        drain is in progress replaces its deadline. Audited as `system.restart` with the
        wait, the live-session count and the names of the changed variables.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                wait_minutes:
                  type: integer
                  minimum: 0
                  maximum: 240
                  default: 15
                  description: How long to let live sessions finish; 0 ends them now.
      responses:
        "202":
          description: The drain has started; the status shows it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "400":
          description: wait_minutes out of range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [admin]
      summary: Cancel a restart in progress
      description: Sessions may start again. Audited as `system.restart_cancel`.
      responses:
        "200":
          description: The drain was abandoned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "409":
          description: No restart is in progress; `code` is `not_draining`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/cli:
    get:
      tags: [admin]
      summary: The console command line's state for this sign-in
      description: >
        Whether the command line (ADR 0027) is open for this sign-in. It opens only after a
        code from the administrator's authenticator, proved at sign-in or through
        `/admin/cli/unlock`, and closes after `idle_minutes` without a command. The route
        does not exist when the gateway runs with `ZANSKAR_CONSOLE_CLI=off`; the console
        then hides the button.
      responses:
        "200":
          description: The state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  unlocked: { type: boolean, description: Commands are accepted now. }
                  mfa_enrolled: { type: boolean, description: The administrator has an authenticator; without one the command line cannot be opened. }
                  idle_minutes: { type: integer, description: Minutes without a command before a fresh code is needed. }
    post:
      tags: [admin]
      summary: Run one command line
      description: >
        Runs a line from the command table (`help` lists it; docs/console-cli.md is the
        reference). Each command is dispatched through the same routes and role checks as
        the console, so it can do only what the API lets this administrator do. There is
        no shell: pipes, redirection and variables are refused, and host-level operations
        (backup, restore, key rotation, audit repair) are not commands. A destructive
        command first answers `status: confirm` with the word to type; the same line sent
        again with `confirm` set to that word, within two minutes, runs it. Every line is
        audited as `cli.command` with its result and the routes it called. Limited to 60
        lines a minute per sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [line]
              properties:
                line: { type: string, maxLength: 1024, example: "sessions --live" }
                confirm: { type: string, description: The word a confirmation asked for. }
      responses:
        "200":
          description: >
            The command ran, failed, asked for confirmation or was cancelled; `status`
            says which, and `lines` is what to print.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok, error, confirm, cancelled] }
                  expect: { type: string, description: With `confirm`, the word to type. }
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        text: { type: string }
                        style: { type: string, enum: [head, ok, warn, error, muted] }
        "403":
          description: >
            `cli_code_required`: a fresh authenticator code is needed first. Or the caller is not
            an administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: >
            `rate_limited`: more than 60 lines in a minute. `cli_locked`: the command line is
            closed for this sign-in after too many wrong codes; a fresh code is refused until the
            lock passes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/cli/unlock:
    post:
      tags: [admin]
      summary: Open the command line with a fresh authenticator code
      description: >
        Checks a code from the administrator's authenticator (a recovery code also works, and
        is used up). Five wrong codes close the command line for this sign-in for 15
        minutes; the sign-in itself is not affected. Audited as `cli.unlock`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: "123456" }
      responses:
        "200":
          description: The command line is open.
          content:
            application/json:
              schema:
                type: object
                properties:
                  unlocked: { type: boolean }
        "422":
          description: The code is wrong; `code` is `bad_code`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The administrator has no authenticator; `code` is `mfa_not_enrolled`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many wrong codes; `code` is `cli_locked`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/retention:
    get:
      tags: [admin]
      summary: Get the recording-retention policy
      description: >
        Returns the current policy. When none has been set both limits are `0`
        (recordings are kept indefinitely) and `updated_at`/`updated_by` are absent.
      responses:
        "200":
          description: The current retention policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionPolicy"
    put:
      tags: [admin]
      summary: Set the recording-retention policy
      description: >
        Sets how long finished recordings are kept. `max_age_days` deletes
        recordings older than that many days; `max_total_bytes` is a backstop
        that deletes the oldest early when the kept total would exceed it. `0`
        disables that dimension, and both `0` keeps everything. The gateway
        sweeps hourly and audits each deletion as `recording.purge`; the
        recording's metadata row is retained so the audit trail still resolves.
        Changing the policy is itself audited as `retention.policy.update`.
        Values must not be negative.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [max_age_days, max_total_bytes]
              properties:
                max_age_days:
                  type: integer
                  minimum: 0
                  description: Days to keep recordings; 0 keeps them indefinitely by age.
                max_total_bytes:
                  type: integer
                  format: int64
                  minimum: 0
                  description: Total-size backstop in bytes; 0 means no cap.
      responses:
        "200":
          description: The updated policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"

# ====================================================================== components
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-zanskar_session
      description: Opaque session token (`zanskar_session` on plain-HTTP loopback). Mutating requests also require the `X-CSRF-Token` header.
    scimBearer:
      type: http
      scheme: bearer
      description: The provider's SCIM token, made in the console. A wrong one is 401, and an address that keeps sending wrong ones gets 429.

  parameters:
    ScimIdp:
      name: idp
      in: path
      required: true
      description: The identity provider's id.
      schema:
        type: string
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    IdpId:
      name: id
      in: path
      required: true
      description: The identity provider `id`.
      schema:
        type: string
    Ticket:
      name: ticket
      in: query
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string

  responses:
    BadRequest:
      description: Validation failed. `message` names the field.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PolicyBadRequest:
      description: >-
        `bad_request`: the body is malformed, carries an unknown field, or fails a rule of
        `AccessPolicyWrite` or `PolicyGrant`, the grant and the field named in the message; a
        new policy names no group or user. `protocol_not_for_kind`: a grant offers a protocol
        its kind does not serve (ssh on a database). `legacy_policy_shape`: the body carries a
        field of the policy shape before 1.8 (ADR 0036), named in the message; nothing is read
        from it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PolicyUnprocessable:
      description: >-
        The policy is well formed but names something it cannot. `invalid_subject`: a group or
        user subject does not exist. `review_only_subject`: a user subject holds only the auditor
        role, which cannot connect. `unknown_target`: a named target or autoscaling group does
        not exist or is retired. `kind_mismatch`: a named target is of another kind than its
        grant. `unknown_grant`: on create a grant carries an `id`, or on update an `id` is not a
        grant of this policy. The last three name the grant by its place in the list.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Not authenticated, MFA not completed, or bad credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but not permitted by role, policy, or CSRF check.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ScimError:
      description: A SCIM error (RFC 7644 section 3.12).
      content:
        application/scim+json:
          schema:
            type: object
            required: [schemas, status]
            properties:
              schemas:
                type: array
                items:
                  type: string
                  enum: ["urn:ietf:params:scim:api:messages:2.0:Error"]
              status:
                type: string
                description: The HTTP status, as a string.
              scimType:
                type: string
                enum: [uniqueness, invalidFilter, invalidValue, invalidSyntax, mutability]
              detail:
                type: string
    NotFound:
      description: No such resource, or not visible to the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Unique constraint or state conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotImplemented:
      description: Planned for a later phase.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: >
        `unavailable`: the gateway cannot check the session cookie right now because its database
        does not answer. Any API call or WebSocket upgrade that carries a cookie can get this. The
        cookie is kept; try again in a moment.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    # ---------------------------------------------------------------- common
    AssetUsage:
      type: object
      description: What deleting a target or an autoscaling group changes (ADR 0036, amended 2026-10-30).
      required: [policies, live_sessions, open_requests]
      properties:
        policies:
          type: array
          description: The policies that name it, in name order.
          items:
            type: object
            required: [policy_id, name, grants_removed, no_grants_left]
            properties:
              policy_id: { type: string }
              name: { type: string }
              grants_removed:
                type: integer
                description: Grants left naming nothing and matching no tag, which go.
              no_grants_left:
                type: boolean
                description: The policy is left with no grant; it stays and grants nobody.
        live_sessions: { type: integer }
        open_requests:
          type: integer
          description: Pending and approved access requests, which are revoked.
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: >-
            Stable machine-readable code, for example `bad_request` (a missing or malformed
            field), `csrf_invalid`, `policy_denied`, `host_key_untrusted`, `instance_unhealthy`,
            `approval_required`, `credential_required` (the target uses the caller's own account,
            so the request must carry `credential`), `not_eligible`, `duration_too_long`,
            `login_user_not_permitted`, `internal`.
        message:
          type: string
          description: For people. Wording may change between releases; match on `code`.
        request_id:
          type: string
          description: >-
            The response's `X-Request-Id`. Quote it in a bug report: the gateway's log lines
            for the request carry the same id.
    PagedResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {}
        next_cursor:
          type: string
          description: Pass as `cursor` for the next page. Absent on the last page.
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        checks:
          type: object
          additionalProperties:
            type: string
          description: Component name to `ok` or a short failure word. Present on `/readyz` only.
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339, UTC.
    Role:
      type: string
      enum: [admin, auditor, user]
    UserStatus:
      type: string
      enum: [active, disabled, locked]
    ActiveStatus:
      type: string
      enum: [active, disabled]
    OsFamily:
      type: string
      enum: [linux, windows, other]
    Protocol:
      type: string
      description: >-
        How a target is reached. `database` is brokered access to a database target (ADR 0017);
        `http` is a web application opened in an isolated browser beside the gateway and
        streamed like a desktop (ADR 0034); it takes a ticket and connects on `/ws/desktop`.
      enum: [ssh, rdp, vnc, winrm, database, http]
    CredentialType:
      type: string
      enum: [password, ssh_key, ssh_ca, domain, ec2_instance_connect]
    CredentialMode:
      type: string
      enum: [vaulted, user_supplied, passthrough]
    HostKeyStatus:
      type: string
      enum: [unknown, pending, trusted, changed]
    ProbeHealth:
      type: string
      enum: [unknown, healthy, unhealthy]
    Outcome:
      type: string
      enum: [success, failure]
    RecordingFormat:
      type: string
      enum: [asciicast, guac]
    EndReason:
      type: string
      enum: [user_exit, idle_timeout, max_duration, admin_terminated, policy_revoked, trust_lost, gateway_restart, target_lost, failover, error]
    Ports:
      type: object
      description: Port per protocol. Missing keys use defaults 22, 3389, 5900, 5986.
      properties:
        ssh:
          type: integer
          minimum: 1
          maximum: 65535
        rdp:
          type: integer
          minimum: 1
          maximum: 65535
        vnc:
          type: integer
          minimum: 1
          maximum: 65535
        winrm:
          type: integer
          minimum: 1
          maximum: 65535
    Tags:
      type: object
      additionalProperties:
        type: string
      examples:
        - env: prod
          team: payments

    # ---------------------------------------------------------------- auth
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 255
        password:
          type: string
          writeOnly: true
    LoginResponse:
      type: object
      required: [status, csrf_token]
      properties:
        status:
          type: string
          enum: [ok, mfa_required, mfa_enrollment_required, password_change_required]
          description: "`ok` means the session is fully usable. `mfa_required` means call `/auth/mfa/totp/verify`. `mfa_enrollment_required` means the deployment requires MFA and the account has none; call `/auth/mfa/totp/enroll`. `password_change_required` means an administrator set the password; call `/auth/password` first, whose response says what is owed next. Until then, any other API call answers 401 with `code` `password_change_required` (the sign-in is not complete), and `/auth/mfa/totp/enroll` and `/auth/mfa/totp/confirm` answer 409 with the same code (that step is out of order)."
        csrf_token:
          type: string
        user:
          $ref: "#/components/schemas/Me"
    TotpCode:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: Six-digit TOTP code or a recovery code.
          writeOnly: true
    TotpEnrollment:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret:
          type: string
          description: Base32 secret, shown once.
        otpauth_uri:
          type: string
          description: "`otpauth://totp/...` for QR rendering, shown once."
    Me:
      type: object
      required: [id, username, display_name, roles, mfa_enrolled, mfa_verified, csrf_token]
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: [string, "null"]
          format: email
        display_name:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        idp_name:
          type: [string, "null"]
        mfa_enrolled:
          type: boolean
        mfa_verified:
          type: boolean
        csrf_token:
          type: string
        session_expires_at:
          $ref: "#/components/schemas/Timestamp"
        time_zone:
          type: string
          description: >
            The IANA zone every time in the console is shown in (runtime setting
            `display.time_zone`; by default the gateway host's zone). 1.9.0.

    # ---------------------------------------------------------------- users and groups
    User:
      type: object
      required: [id, username, display_name, status, roles, created_at, updated_at]
      properties:
        must_change_password:
          type: boolean
          description: An administrator set the password; the user replaces it at their next sign-in.
        initial_password:
          type: string
          readOnly: true
          description: Only in the `POST /users` response when a one-time password was generated; shown once, never stored in clear.
        id:
          type: string
        username:
          type: string
        email:
          type: [string, "null"]
          format: email
        display_name:
          type: string
        status:
          $ref: "#/components/schemas/UserStatus"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        idp_id:
          type: [string, "null"]
          description: The identity provider the account belongs to, when one does; the console names it in the Source column.
        external_id:
          type: [string, "null"]
        provider_sign_in:
          type: boolean
          description: The account has no password of its own and signs in through an identity provider, linked (idp_id) or waiting for its first sign-in. Derived when read; absent when false.
        scim_external_id:
          type: string
          description: The provider's own id for the person, as its SCIM client sent it.
        scim_deleted_at:
          description: When the provider's SCIM client deleted the account; it is kept, disabled.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        directory_removed_at:
          description: >
            When the directory user sync or SCIM disabled the account because the person left
            the provider (ADR 0035). While the provider still decides, the status cannot be
            changed by hand; the mark goes when the person is back.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        mfa_enrolled:
          type: boolean
        failed_logins:
          type: integer
        locked_until:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        last_login_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
    UserCreate:
      type: object
      required: [username, display_name, roles]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
          pattern: "^[a-z0-9._@-]+$"
        email:
          type: string
          format: email
        display_name:
          type: string
          minLength: 1
          maxLength: 255
        password:
          type: string
          minLength: 12
          writeOnly: true
          description: >
            Checked against a breached-password list and hashed with Argon2id. Omitted, a
            one-time password is generated and returned once as `initial_password` (unless
            `password_less`).
        password_less:
          type: boolean
          default: false
          description: >
            Create the account with no password at all, for someone who signs in through an
            identity provider. Use the username the provider asserts: the first sign-in through a
            provider under that username links the account to it, keeping the roles given here,
            whether or not the provider creates users on first sign-in (ADR 0005). An account
            with a password is never linked to a provider.
        roles:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Role"
        must_change_password:
          type: boolean
          default: true
          description: The user must replace the password at their next sign-in, before the second factor (QA finding R25).
        group_ids:
          type: array
          items:
            type: string
          description: >
            Groups to put the user in, written in the same transaction as the account (1.9.0).
            Repeats and blanks are dropped. A group that does not exist, or whose members come
            from an identity provider, refuses the whole request with `422 invalid_group` naming
            it, and no account is made.
    UserUpdate:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          description: Empty clears the email; left out keeps it.
        display_name:
          type: string
        status:
          $ref: "#/components/schemas/UserStatus"
    UserRolesWrite:
      type: object
      additionalProperties: false
      required: [roles]
      properties:
        roles:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Role"
    UserPasswordWrite:
      type: object
      additionalProperties: false
      properties:
        password:
          type: string
          minLength: 12
          writeOnly: true
          description: The new password. Ignored when `generate` is true.
        generate:
          type: boolean
          default: false
          description: Generate a one-time password instead; the response carries it once as `initial_password`.
        must_change_password:
          type: boolean
          default: true
          description: The user must replace the password at their next sign-in.
    Group:
      type: object
      required: [id, name, description, member_count, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        idp_id:
          type: [string, "null"]
        external_id:
          type: [string, "null"]
        member_count:
          type: integer
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
    GroupMember:
      type: object
      required: [user_id, username, display_name, added_at]
      properties:
        user_id:
          type: string
        username:
          type: string
        display_name:
          type: string
        added_at:
          $ref: "#/components/schemas/Timestamp"
    GroupDetail:
      allOf:
        - $ref: "#/components/schemas/Group"
        - type: object
          required: [members]
          properties:
            members:
              type: array
              items:
                $ref: "#/components/schemas/GroupMember"
    GroupWrite:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 2000
        user_ids:
          type: array
          items:
            type: string
          description: >
            On create only: members added in the same transaction as the group (1.9.0). An
            unknown user refuses the whole request with `422 invalid_user` naming it, and no
            group is made. Ignored on update; members have their own routes.

    # ---------------------------------------------------------------- identity providers
    IdentityProvider:
      type: object
      required: [id, name, type, enabled, config, has_secret, created_at, updated_at]
      properties:
        id:
          type: string
          description: Used in `/auth/oidc/{idp}/...` paths.
        name:
          type: string
        type:
          type: string
          enum: [oidc, ldap]
        enabled:
          type: boolean
        config:
          $ref: "#/components/schemas/IdentityProviderConfigPublic"
        has_secret:
          type: boolean
          description: A client secret or bind password is stored. It is never returned.
        sync:
          $ref: "#/components/schemas/IdentityProviderSync"
          description: In listings, for a provider with its user sync on.
        scim_token_created_at:
          $ref: "#/components/schemas/Timestamp"
          description: When the provider's SCIM token was made; absent when it has none.
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
    IdentityProviderConfigPublic:
      type: object
      description: |
        The provider's configuration, stored sealed. Exactly one of `oidc` and `ldap` is set.
        Secrets (`client_secret`, `bind_password`) are write-only: always returned empty, and
        left empty on update they keep the stored value.
      properties:
        oidc:
          type: object
          properties:
            issuer:
              type: string
              format: uri
              description: https issuer; discovery finds the rest. For user sync, a Keycloak realm (`https://host/realms/name`).
            client_id:
              type: string
            client_secret:
              type: string
              writeOnly: true
            scopes:
              type: array
              items:
                type: string
              description: Default openid, profile, email.
            username_claim:
              type: string
              description: |
                Default `preferred_username`; Okta and Entra ID put an email address there, which is a
                valid username. `email` is used only when the provider has verified the address. With
                user sync, `preferred_username`, `email` or `sub`.
            groups_claim:
              type: string
              description: Claim carrying group names for the group mapping; empty turns group mapping off.
            allowed_domains:
              type: array
              items:
                type: string
              description: Only addresses the provider has verified in these domains may sign in.
            trust_email:
              type: boolean
              description: Accept an email the provider never marks verified or not (Entra ID).
            zanskar_mfa:
              type: boolean
              description: |
                The provider does no MFA of its own: ask for a Zanskar authenticator after it. Off
                by default; the provider's sign-in is then the second factor (ADR 0035).
            keep_provider_session:
              type: boolean
              description: Signing out of Zanskar leaves the provider's session alone. Off by default.
            prompt_login:
              type: boolean
              description: |
                Ask the provider for a fresh sign-in every time (`prompt=login` and `max_age=0`), and
                refuse one whose `auth_time` is older than the sign-in (`reauth_not_done`) or absent
                (`auth_time_missing`; Entra ID sends it only as an optional claim). For a provider
                whose sign-out keeps its own session. Google takes no `prompt=login`.
        ldap:
          type: object
          properties:
            url:
              type: string
              description: "`ldaps://host:636`, or `ldap://` with `start_tls`."
            start_tls:
              type: boolean
            ca_cert_pem:
              type: string
              description: PEM bundle the directory's certificate must chain to.
            insecure_skip_verify:
              type: boolean
            bind_dn:
              type: string
            bind_password:
              type: string
              writeOnly: true
            base_dn:
              type: string
            user_filter:
              type: string
              description: Exactly one `%s`, the login name. The user sync lists it with `*` in its place.
            username_attr:
              type: string
            display_name_attr:
              type: string
            email_attr:
              type: string
            group_attr:
              type: string
            group_base_dn:
              type: string
            group_filter:
              type: string
            group_name_attr:
              type: string
            username_suffix:
              type: string
        default_roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
          description: Roles for accounts the provider creates. Default `[user]`.
        group_mapping:
          type: object
          additionalProperties:
            type: string
          description: External group (claim value, or LDAP group DN or name) to Zanskar group id, applied at each sign-in.
        auto_provision:
          type: boolean
          description: Create an account for a person the provider asserts and Zanskar does not know, at sign-in or by the sync.
        sync_users:
          type: boolean
          description: |
            List the directory every `sync_minutes`: a Keycloak realm (the client's service account
            needs `realm-management` `view-users`) or an LDAP directory. People who join get accounts,
            people who leave are disabled and their sessions end (ADR 0035). Groups are not synced.
        sync_minutes:
          type: integer
          minimum: 5
          maximum: 1440
          default: 15
        scim:
          type: boolean
          description: The provider pushes its people over SCIM 2.0 (`/scim/{idp}`). Not with `sync_users`.
    IdentityProviderSync:
      type: object
      required: [enabled, interval_minutes, running, last, next_at]
      properties:
        enabled:
          type: boolean
        interval_minutes:
          type: integer
        running:
          type: boolean
        next_at:
          description: >-
            When the schedule lists the provider next: `interval_minutes` after the last run, or now
            before the first. The run starts at the scheduler's next minute tick from then on, so a
            time already past means within a minute. Null while the provider is disabled or a run is
            going.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Timestamp"
        last:
          description: The last run since the gateway started; null before the first.
          oneOf:
            - type: "null"
            - type: object
              required: [at, ok, listed, created, linked, updated, enabled, disabled, not_created, held, live_sessions_ended]
              properties:
                at:
                  $ref: "#/components/schemas/Timestamp"
                ok:
                  type: boolean
                error:
                  type: string
                listed:
                  type: integer
                  description: People the directory listed.
                created:
                  type: integer
                linked:
                  type: integer
                  description: Pre-created accounts adopted.
                updated:
                  type: integer
                  description: Accounts whose name or address changed.
                enabled:
                  type: integer
                  description: Accounts enabled again, their person back in the directory.
                disabled:
                  type: integer
                  description: Accounts disabled, their person gone from the directory.
                not_created:
                  type: integer
                  description: People without an account who were not given one (auto_provision off).
                conflicts:
                  type: array
                  items:
                    type: string
                  description: Usernames that could not be linked or created (at most 20).
                held:
                  type: integer
                  description: Accounts whose person left but which this run did not disable.
                held_reason:
                  type: string
                live_sessions_ended:
                  type: integer
    IdentityProviderWrite:
      type: object
      required: [name, type, config]
      properties:
        name:
          type: string
          maxLength: 64
        type:
          type: string
          enum: [oidc, ldap]
        enabled:
          type: boolean
          default: true
        config:
          $ref: "#/components/schemas/IdentityProviderConfigPublic"

    ScimUser:
      type: object
      description: A person as SCIM shows them (core User schema). Attribute names are case-insensitive on input.
      properties:
        schemas:
          type: array
          items:
            type: string
        id:
          type: string
          readOnly: true
        externalId:
          type: string
          description: The provider's own id for the person.
        userName:
          type: string
          description: The Zanskar username; a plain name or an email address.
        displayName:
          type: string
        name:
          type: object
          properties:
            formatted:
              type: string
            givenName:
              type: string
            familyName:
              type: string
        emails:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
              type:
                type: string
              primary:
                type: boolean
        active:
          type: boolean
        meta:
          type: object
          readOnly: true
    ScimListResponse:
      type: object
      required: [schemas, totalResults, Resources]
      properties:
        schemas:
          type: array
          items:
            type: string
        totalResults:
          type: integer
        itemsPerPage:
          type: integer
        startIndex:
          type: integer
        Resources:
          type: array
          items:
            type: object
    ScimPatchOp:
      type: object
      required: [Operations]
      properties:
        schemas:
          type: array
          items:
            type: string
        Operations:
          type: array
          items:
            type: object
            required: [op]
            properties:
              op:
                type: string
                description: add, replace or remove, in any case.
              path:
                type: string
              value: {}

    # ---------------------------------------------------------------- credentials
    Credential:
      type: object
      required: [id, name, type, mode, created_at, updated_at, in_use_by]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          $ref: "#/components/schemas/CredentialType"
        mode:
          $ref: "#/components/schemas/CredentialMode"
        username:
          type: [string, "null"]
        domain:
          type: [string, "null"]
        public_key:
          type: [string, "null"]
          description: SSH public key or CA public key. The only key material ever returned.
        has_secret:
          type: boolean
        key_version:
          type: [integer, "null"]
        created_by:
          type: [string, "null"]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        rotated_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        in_use_by:
          type: object
          required: [targets, autoscaling_groups]
          properties:
            targets:
              type: integer
            autoscaling_groups:
              type: integer
        certificate_ttl_seconds:
          type: integer
          description: "`ssh_ca` only; absent means the default of 300."
        certificate_principals:
          type: array
          items:
            type: string
          description: "`ssh_ca` only; absent means any login user."
        rotation:
          type: object
          description: "`ssh_ca` only; present while a next key is prepared or a retired key is left to remove from targets (ADR 0022)."
          properties:
            pending_public_key:
              type: string
            pending_since:
              $ref: "#/components/schemas/Timestamp"
            retired_public_key:
              type: string
            retired_at:
              $ref: "#/components/schemas/Timestamp"
    CredentialWrite:
      type: object
      required: [name, type, mode]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        type:
          $ref: "#/components/schemas/CredentialType"
        mode:
          $ref: "#/components/schemas/CredentialMode"
        username:
          type: string
          description: >
            Required for `vaulted` except `ssh_ca`, where blank means each user logs in as
            their own Zanskar username. Ignored for `user_supplied` and `passthrough`.
        domain:
          type: string
          description: For `type=domain`.
        password:
          type: string
          writeOnly: true
          description: For `type=password` or `type=domain` with `mode=vaulted`.
        private_key:
          type: string
          writeOnly: true
          description: PEM or OpenSSH private key for `ssh_key` or `ssh_ca`. Omit to have Zanskar generate one.
        private_key_passphrase:
          type: string
          writeOnly: true
        certificate_ttl_seconds:
          type: integer
          minimum: 60
          maximum: 3600
          default: 300
          description: >
            For `ssh_ca` (ADR 0022). Lifetime of each certificate minted for a session; it only
            has to outlive the handshake. Zero or absent means the default.
        certificate_principals:
          type: array
          maxItems: 64
          items:
            type: string
          description: >
            For `ssh_ca` (ADR 0022). Allowlist of login users the authority issues certificates
            for. Each certificate carries exactly one principal, the session's login user
            (`username`, else the Zanskar username); a connect for a login user not listed is
            refused with `login_user_not_permitted`. Empty means any login user.

    # ---------------------------------------------------------------- targets
    Target:
      type: object
      required: [id, name, address, os_family, ports, capabilities, host_key_status, tags, status, credentials, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
        engine:
          type: string
          description: Database engine for a database target (ADR 0017); empty for a host target.
        engine_version:
          type: string
          description: Optional database engine version for a database target.
        database_name:
          type: string
        tls_mode:
          type: string
          enum: [disable, prefer, require, verify-full]
        tls_ca:
          type: string
          description: PEM CA bundle the upstream's certificate is verified against; for a database target under verify-full, or an application's https upstream.
        app_upstream:
          type: string
          description: >-
            Makes the target an application (ADR 0034): the one origin, `http://host[:port]` or
            `https://host[:port]`, the session's isolated browser can reach. Nothing else is
            reachable from it. Its host becomes `address`.
        os_family:
          $ref: "#/components/schemas/OsFamily"
        ports:
          $ref: "#/components/schemas/Ports"
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Protocol"
        host_key_fingerprint:
          type: [string, "null"]
        host_key_status:
          $ref: "#/components/schemas/HostKeyStatus"
        tls_fingerprint:
          type: [string, "null"]
          description: SHA-256 of the RDP listener certificate pinned by the first probe (ADR 0012).
        winrm_tls_fingerprint:
          type: [string, "null"]
          description: SHA-256 of the WinRM HTTPS listener certificate pinned by the first probe.
        tls_fingerprint_pending:
          type: [string, "null"]
          description: >
            A different RDP certificate a later probe saw. The pinned one stays and RDP
            connections are refused until an administrator accepts this one with
            `POST /targets/{id}/certificate/trust`. A probe never replaces a pin.
        winrm_tls_fingerprint_pending:
          type: [string, "null"]
          description: The WinRM counterpart of `tls_fingerprint_pending`.
        tags:
          $ref: "#/components/schemas/Tags"
        status:
          $ref: "#/components/schemas/ActiveStatus"
        notes:
          type: string
        credentials:
          type: object
          description: Credential id per protocol.
          additionalProperties:
            type: string
        created_by:
          type: [string, "null"]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        last_probed_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
    TargetWrite:
      type: object
      required: [name, address, os_family]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        address:
          type: string
          description: >-
            Hostname or IP. An IP the gateway never connects to is refused with 422
            `address_forbidden`: loopback, link-local, multicast, unspecified, the cloud metadata
            services outside link-local (`fd00:ec2::254`, `fd00:ec2::23`, `100.100.100.200`,
            `168.63.129.16`, `192.0.0.192`), and the address the
            gateway listens on when `ZANSKAR_LISTEN_ADDR` names one. A hostname is checked the same
            way each time it is looked up, by the probe and by every session.
        engine:
          type: string
          description: >
            Set to make this a database target (ADR 0017), one of postgres, mysql, mariadb.
            os_family then defaults to "other" and host-oriented fields do not apply. Each
            session runs a client container beside a credential-holding sidecar (pgbouncer
            for postgres, the gateway's own relay for mysql and mariadb); the client never
            receives the password.
        engine_version:
          type: string
          description: Optional database engine version.
        retention_days:
          type: integer
          nullable: true
          minimum: 1
          maximum: 3650
          description: Recording retention for this target's sessions, over the grant's; null defers.
        database_name:
          type: string
          maxLength: 128
          description: >
            Database the session opens (database targets). Empty means the engine's
            convention: PostgreSQL opens a database named after the role, MySQL and MariaDB
            open with no schema selected.
        tls_mode:
          type: string
          enum: [disable, prefer, require, verify-full]
          description: >
            How the credential-holding sidecar protects its connection to the database
            (database targets). Default verify-full (ADR 0025): the chain is checked against
            tls_ca and the host name, so tls_ca is required; creating a database target
            with neither is refused. require and prefer encrypt without verifying.
        tls_ca:
          type: string
          description: PEM bundle trusted for verify-full, for example the provider's CA; required for that mode.
        os_family:
          $ref: "#/components/schemas/OsFamily"
        ports:
          $ref: "#/components/schemas/Ports"
        capabilities:
          type: array
          description: Declared capabilities. Overwritten by the next probe.
          items:
            $ref: "#/components/schemas/Protocol"
        tags:
          $ref: "#/components/schemas/Tags"
        status:
          $ref: "#/components/schemas/ActiveStatus"
        notes:
          type: string
          maxLength: 4000
        credentials:
          type: object
          description: Credential id per protocol. Replaces the whole mapping.
          additionalProperties:
            type: string
    ProbeResult:
      type: object
      required: [capabilities, host_key_status, probed_at, ports]
      properties:
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Protocol"
        ports:
          type: object
          description: Per protocol, whether the port answered and the latency.
          additionalProperties:
            type: object
            required: [reachable]
            properties:
              reachable:
                type: boolean
              latency_ms:
                type: integer
              error:
                type: string
        host_key_fingerprint:
          type: [string, "null"]
        host_key_status:
          $ref: "#/components/schemas/HostKeyStatus"
        host_key_changed_from:
          type: [string, "null"]
          description: The previously trusted fingerprint when `host_key_status` became `changed`.
        tls_fingerprint:
          type: [string, "null"]
        probed_at:
          $ref: "#/components/schemas/Timestamp"

    # ---------------------------------------------------------------- policies
    TimeWindow:
      type: object
      required: [days, from, to, tz]
      properties:
        days:
          type: array
          items:
            type: string
            enum: [mon, tue, wed, thu, fri, sat, sun]
        from:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        to:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: >-
            End of the window, exclusive. Earlier than `from` for a window that runs past
            midnight into the next day; equal to `from` (`00:00` to `00:00`) for the whole of
            each listed day.
        tz:
          type: string
          description: IANA zone name.
    TargetKind:
      type: string
      description: >-
        What a grant gives access to (ADR 0036). A target's kind is derived, never stored: a
        target with an `engine` is a `database`, one with an `app_upstream` an `application`, any
        other a `host`; an autoscaling group is `autoscaling`. Each kind serves its own protocols
        and no others: `host` and `autoscaling` ssh, rdp, vnc and winrm; `database` database;
        `application` http.
      enum: [host, database, application, autoscaling]
    PolicySubject:
      type: object
      description: One group or user a policy applies to.
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [group, user]
        id:
          type: string
          description: >-
            The group's or the user's id. A user must be able to connect: an account holding only
            the auditor role is refused (`422 review_only_subject`).
    GrantTarget:
      type: object
      description: One named target, or autoscaling group, and the protocols granted on it.
      required: [id, protocols]
      properties:
        id:
          type: string
          description: >-
            A target id, or for an `autoscaling` grant an autoscaling group id. It must be live
            (not retired or deleted) and of the grant's kind.
        protocols:
          type: array
          minItems: 1
          uniqueItems: true
          description: One or more of the protocols the grant's kind serves.
          items:
            $ref: "#/components/schemas/Protocol"
    TagMatch:
      type: object
      description: >-
        Selects every target of the grant's kind that carries every key with one of its values,
        judged at each connect: a target tagged later joins, one untagged leaves at its next
        connect. A host grant's tags match hosts only.
      required: [match, protocols]
      properties:
        match:
          type: object
          minProperties: 1
          maxProperties: 32
          description: Tag keys of 1-64 characters, each with the values it may have.
          additionalProperties:
            type: array
            minItems: 1
            maxItems: 16
            uniqueItems: true
            items:
              type: string
              minLength: 1
              maxLength: 64
          examples:
            - env: [prod]
              tier: [web, api]
        protocols:
          type: array
          minItems: 1
          uniqueItems: true
          description: One or more of the protocols the grant's kind serves.
          items:
            $ref: "#/components/schemas/Protocol"
    PolicyGrant:
      type: object
      description: >-
        One complete grant (ADR 0036): a kind of target, which targets of that kind (named, by
        tag, or both), and every condition a session opens and runs under; nothing is inherited
        from the policy. When several grants admit the same session, standing access wins over
        approval, and each term is the strictest among the deciding grants: the shortest idle
        and maximum, clipboard and file transfer only if every one allows them, an authenticator
        if any requires one; retention is the longest. In a write everything but `kind` may be
        left out and takes the default shown. A read carries every field, `tags` only when set.
      required: [kind]
      properties:
        id:
          type: string
          description: >-
            Made by the server. Send it back on update, so access requests and the audit trail
            keep pointing at the same grant; leave it out for a new grant. On create no grant may
            carry one, and on update an id that is not a grant of this policy is refused; both
            are `422 unknown_grant`.
        kind:
          $ref: "#/components/schemas/TargetKind"
        targets:
          type: array
          maxItems: 200
          default: []
          description: Named targets, none twice. A grant names targets, matches tags, or both.
          items:
            $ref: "#/components/schemas/GrantTarget"
        tags:
          $ref: "#/components/schemas/TagMatch"
        access:
          type: string
          enum: [standing, approval]
          default: standing
          description: >-
            `standing` admits at once. `approval` makes the person eligible to request access
            (ADR 0018), and `/connect` issues a ticket only while they hold an active, approved
            grant. Where a standing grant also admits, it wins.
        sign_in:
          type: string
          enum: [target, own]
          default: target
          description: >-
            `target`: the target's credential slot decides (its vaulted credential, its SSH
            authority, or the person's own account when the slot is user supplied). `own`: the
            person signs in with their own login whatever the slot holds, typed at connect time
            and never stored. If any deciding grant says `target` the slot decides, and the person
            may still bring their own login where another says `own`; if all say `own`, their own
            login is asked for. Not allowed on an `application` grant.
        require_mfa:
          type: boolean
          default: true
        allow_clipboard:
          type: boolean
          default: false
        allow_file_transfer:
          type: boolean
          default: false
        allow_devtools:
          type: boolean
          default: false
          description: >
            Chromium's developer tools in the application's isolated browser (ADR 0037).
            Allowed only on an `application` grant; where several grants admit a person, every
            one must allow them.
        idle_timeout_minutes:
          type: integer
          minimum: 1
          maximum: 1440
          default: 15
        max_session_minutes:
          type: [integer, "null"]
          minimum: 1
          maximum: 10080
          description: >-
            The longest a session may run; null for no limit. On an approval grant it also caps
            the duration a request may ask for, 480 minutes when null.
        time_windows:
          type: array
          default: []
          description: >-
            When a connect is admitted; empty means at any time. A window that shuts, or one
            narrowed by an edit, does not end a running session; its maximum bounds it instead.
          items:
            $ref: "#/components/schemas/TimeWindow"
        retention_days:
          type: [integer, "null"]
          minimum: 1
          maximum: 3650
          description: >-
            Keep the recordings of the sessions this grant admits for that many days; null defers
            to the global retention policy. A target's own `retention_days` wins over it. Fixed on
            each recording when its session starts.
    AccessPolicy:
      type: object
      description: >-
        An audience and the grants it holds (ADR 0036). The policy says who, any number of groups
        and users, and whether it is on; each grant says, completely and on its own, what and on
        which terms. A person's access is the union of the grants of every enabled policy that
        names them or a group they belong to. A deleted group leaves the policies that named it,
        so a policy can be read back with no subjects: it grants no one, and a write must name
        someone again.
      required: [id, name, description, enabled, subjects, grants, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
          description: Off, the policy grants nothing, and the live sessions it admitted are re-checked.
        subjects:
          type: array
          items:
            $ref: "#/components/schemas/PolicySubject"
        grants:
          type: array
          items:
            $ref: "#/components/schemas/PolicyGrant"
        created_by:
          type: string
          description: The admin who created the policy; absent when not known.
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
      examples:
        - id: 4f1c0a9e2b7d4e8f9a6b3c2d1e0f7a8b
          name: platform-prod
          description: ""
          enabled: true
          subjects:
            - {kind: group, id: 9d2e41c07b3a4f5e8c6d1a2b3c4d5e6f}
            - {kind: user, id: 7a8b9c0d1e2f4a5b6c7d8e9f0a1b2c3d}
          grants:
            - id: 0b1c2d3e4f5a4b6c8d7e9f0a1b2c3d4e
              kind: host
              targets:
                - {id: 1e2d3c4b5a6f4e7d8c9b0a1f2e3d4c5b, protocols: [ssh]}
                - {id: 2f3e4d5c6b7a4f8e9d0c1b2a3f4e5d6c, protocols: [rdp, winrm]}
              tags: {match: {env: [prod], tier: [web, api]}, protocols: [ssh]}
              access: approval
              sign_in: target
              require_mfa: true
              allow_clipboard: false
              allow_file_transfer: false
              idle_timeout_minutes: 15
              max_session_minutes: 120
              time_windows:
                - {days: [mon, tue, wed, thu, fri], from: "08:00", to: "20:00", tz: Europe/Berlin}
              retention_days: 365
            - id: 5c6d7e8f9a0b4c1d2e3f4a5b6c7d8e9f
              kind: database
              targets:
                - {id: 3a4b5c6d7e8f4a9b0c1d2e3f4a5b6c7d, protocols: [database]}
              access: standing
              sign_in: target
              require_mfa: true
              allow_clipboard: false
              allow_file_transfer: false
              idle_timeout_minutes: 30
              max_session_minutes: null
              time_windows: []
              retention_days: null
          created_by: 8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e
          created_at: "2026-10-30T09:00:00Z"
          updated_at: "2026-10-30T09:00:00Z"
    AccessPolicyWrite:
      type: object
      description: >-
        The body of create and update: a policy without `id`, `created_by`, `created_at` and
        `updated_at`. Update replaces the whole policy, subjects and grants included, and a
        switch left out takes its default, not its current value. A field of the shape before
        1.8 (`group_id`, `user_id`, `target_selector`, `protocols`, `rules`, or a condition now
        on each grant: `require_approval`, `require_mfa`, `allow_clipboard`,
        `allow_file_transfer`, `idle_timeout_minutes`, `max_session_minutes`, `time_windows`,
        `retention_days`) is refused by name with `400 legacy_policy_shape`; any other unknown
        field, here or in a grant, with `400 bad_request`.
      required: [name, subjects, grants]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Unique. Leading and trailing spaces are dropped.
        description:
          type: string
        enabled:
          type: boolean
          default: true
        subjects:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PolicySubject"
        grants:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: "#/components/schemas/PolicyGrant"

    AccessRequestStatus:
      type: string
      enum: [pending, approved, denied, expired, revoked]
    AccessRequest:
      type: object
      description: >-
        An access request and, once approved, the time-bounded grant it becomes (ADR 0018).
        `requested_minutes` is the duration asked for; on approval `expires_at` is set that many
        minutes ahead and the grant lets `/connect` issue tickets until then. Exactly one of
        `target_id` and `asg_id` is set.
      required: [id, user_id, protocol, reason, requested_minutes, status, created_at, updated_at]
      properties:
        id:
          type: string
        user_id:
          type: string
        username:
          type: string
          description: Resolved at read time.
        approver_username:
          type: string
          description: Resolved at read time; present once decided.
        policy_id:
          type: string
          description: The policy whose approval grant made the request eligible.
        grant_id:
          type: string
          description: >-
            The approval grant, in `policy_id`, that made the request eligible and capped its
            duration: of several, the one with the shortest maximum (ADR 0036). A record, not an
            authority: approval and `/connect` judge the policies as they stand then. Absent on
            requests made before 1.8.
        target_id:
          type: string
        target_name:
          type: string
          description: Resolved at read time; a retired target still labels its requests.
        asg_id:
          type: string
        asg_name:
          type: string
          description: Resolved at read time.
        approved_minutes:
          type: integer
          description: What the approver granted; may differ from `requested_minutes`. Absent until decided.
        extends_request_id:
          type: string
          description: The active grant this request asked to extend, when it is an extension.
        protocol:
          $ref: "#/components/schemas/Protocol"
        reason:
          type: string
        requested_minutes:
          type: integer
        status:
          $ref: "#/components/schemas/AccessRequestStatus"
        approver_user_id:
          type: string
          description: The admin who approved or denied the request.
        decision_note:
          type: string
          description: Optional note the approver left with the decision.
        decided_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
    AccessRequestCreate:
      type: object
      description: Names exactly one of `target_id` and `asg_id`.
      required: [protocol, reason, minutes]
      properties:
        target_id:
          type: string
          description: The host access is asked for.
        asg_id:
          type: string
          description: >-
            The autoscaling group access is asked for. The grant covers every instance of the
            group, including ones launched after approval.
        protocol:
          $ref: "#/components/schemas/Protocol"
        reason:
          type: string
          minLength: 1
          description: Why access is needed; recorded on the request and in the audit log.
        minutes:
          type: integer
          minimum: 1
          description: >-
            Requested grant duration. Capped at the approval grant's `max_session_minutes`, the
            shortest when several grants make the caller eligible, or 480 when it sets none.
        extends_request_id:
          type: string
          description: >-
            Ask to extend the caller's active grant of this id for the same target and protocol.
            Once approved, the new grant runs on from that grant's expiry. Refused with
            `409 not_extendable` when the id is not the caller's active grant.
    AccessDecision:
      type: object
      description: Optional note carried with an approve, deny, or revoke; on approve, optionally the granted duration.
      properties:
        note:
          type: string
        minutes:
          type: integer
          minimum: 1
          description: >-
            Approve only: grant this many minutes instead of `requested_minutes`. Must not exceed
            the approval grant's maximum (`400 duration_too_long`). The requested figure stays on the record.
    # ---------------------------------------------------------------- autoscaling
    AutoscalingGroup:
      type: object
      required: [id, name, provider, region, external_name, role_arn, external_id, os_family, ports, capabilities, address_preference, poll_interval_seconds, tags, status, last_synced_at, credentials, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        provider:
          type: string
          enum: [aws]
        region:
          type: string
        external_name:
          type: string
          description: The AWS Auto Scaling group name.
        role_arn:
          type: string
        external_id:
          type: string
          description: Generated by Zanskar. Must appear in the role's trust policy condition.
        os_family:
          $ref: "#/components/schemas/OsFamily"
        ports:
          $ref: "#/components/schemas/Ports"
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Protocol"
        address_preference:
          type: string
          enum: [private, public]
        poll_interval_seconds:
          type: integer
        tags:
          $ref: "#/components/schemas/Tags"
        status:
          $ref: "#/components/schemas/ActiveStatus"
        credentials:
          type: object
          description: Bound credential ids, keyed by protocol.
          additionalProperties:
            type: string
        last_synced_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        last_error:
          type: string
          description: Absent when the last sync succeeded.
        created_by:
          type: string
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
    AutoscalingGroupListed:
      allOf:
        - $ref: "#/components/schemas/AutoscalingGroup"
        - type: object
          required: [healthy_count, instance_count]
          properties:
            healthy_count:
              type: integer
              description: Live instances currently in the healthy pool.
            instance_count:
              type: integer
              description: Instances not yet terminated.
    AutoscalingGroupWrite:
      type: object
      required: [name, provider, region, external_name, role_arn, os_family]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        provider:
          type: string
          enum: [aws]
        region:
          type: string
          examples: [ap-south-1]
        external_name:
          type: string
        external_id:
          type: string
          pattern: "^zanskar-[0-9a-f]{32}$"
          description: On create only, the ExternalId an IAM preview minted, so the saved group matches the role created with it (ADR 0023). Omitted, a new one is minted.
        role_arn:
          type: string
          pattern: "^arn:aws(-us-gov|-cn)?:iam::[0-9]{12}:role/.+$"
        os_family:
          $ref: "#/components/schemas/OsFamily"
        ports:
          $ref: "#/components/schemas/Ports"
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Protocol"
          description: Declared capabilities for every instance. The gateway probe confirms them per instance.
        address_preference:
          type: string
          enum: [private, public]
          default: private
        poll_interval_seconds:
          type: integer
          minimum: 10
          maximum: 3600
          default: 30
        tags:
          $ref: "#/components/schemas/Tags"
        status:
          $ref: "#/components/schemas/ActiveStatus"
        credentials:
          type: object
          description: >
            Credential id per protocol. One credential profile serves every instance. A value of
            `user_supplied` has the user asked for their own username and password at connect
            time, as when binding one protocol: the group then carries the shared prompt
            credential's id.
          additionalProperties:
            type: string
        rotate_external_id:
          type: boolean
          default: false
          description: On update, issue a new external id. The role's trust policy must then be updated with it.
    AwsIdentity:
      type: object
      required: [source, platform, checked_at]
      properties:
        principal:
          type: string
          description: The role ARN to name in trust policies.
        source:
          type: string
          enum: [environment, detected, none]
        platform:
          type: string
          enum: [aws, none]
          description: >
            Where the gateway runs as far as AWS is concerned: "aws" on EC2, EKS or
            ECS, "none" anywhere else. Off AWS, a missing identity is the ordinary
            case, not an error.
        account_id:
          type: string
        raw_arn:
          type: string
          description: What STS reported, before conversion.
        checked_at:
          $ref: "#/components/schemas/Timestamp"
        error:
          type: string
          description: >
            Why there is no identity, in a sentence ("This machine has no IAM role.
            Attach an instance profile to it."). The AWS SDK's own error goes to the
            gateway's log, not here.
    AsgIAMDocs:
      type: object
      required: [external_id, principal_source, role_name, permissions_policy]
      properties:
        external_id:
          type: string
        gateway_principal:
          type: string
        principal_source:
          type: string
          enum: [environment, detected, none]
        principal_error:
          type: string
        role_name:
          type: string
          description: The suggested role name, used by the script and the template.
        trust_policy:
          type: string
          description: JSON document; absent when the principal is unknown.
        permissions_policy:
          type: string
          description: JSON document.
        cli:
          type: string
          description: AWS CLI script creating the role; absent when the principal is unknown.
        cloudformation:
          type: string
          description: CloudFormation template for the role; absent when the principal is unknown.
    AsgAccessTest:
      type: object
      required: [ok, group_found, instance_count]
      properties:
        ok:
          type: boolean
        stage:
          type: string
          enum: [assume, describe, group]
        error:
          type: string
        assumed_arn:
          type: string
        group_found:
          type: boolean
        instance_count:
          type: integer
    AsgInstance:
      type: object
      required: [id, asg_id, instance_id, lifecycle_state, probe_health, healthy, first_seen_at, last_seen_at]
      properties:
        id:
          type: string
        asg_id:
          type: string
        instance_id:
          type: string
        private_ip:
          type: [string, "null"]
        public_ip:
          type: [string, "null"]
        availability_zone:
          type: [string, "null"]
        lifecycle_state:
          type: string
          examples: [InService, Terminating]
        lb_health:
          type: [string, "null"]
        probe_health:
          $ref: "#/components/schemas/ProbeHealth"
        healthy:
          type: boolean
          description: Derived. True when `lifecycle_state` is `InService`, `lb_health` is healthy or null, and `probe_health` is healthy.
        host_key_fingerprint:
          type: [string, "null"]
        tls_fingerprint:
          type: [string, "null"]
          description: >-
            SHA-256 of the RDP listener certificate this instance first presented (ADR 0024).
            Pinned per instance; a later change marks the instance unhealthy instead of re-pinning.
        winrm_tls_fingerprint:
          type: [string, "null"]
          description: SHA-256 of the WinRM HTTPS listener certificate this instance first presented.
        launched_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        first_seen_at:
          $ref: "#/components/schemas/Timestamp"
        last_seen_at:
          $ref: "#/components/schemas/Timestamp"
        terminated_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
    SyncResult:
      type: object
      required: [synced_at, healthy_count, total_count, added, removed]
      properties:
        synced_at:
          $ref: "#/components/schemas/Timestamp"
        healthy_count:
          type: integer
        total_count:
          type: integer
        added:
          type: array
          items:
            type: string
          description: Instance ids seen for the first time.
        removed:
          type: array
          items:
            type: string
          description: Instance ids marked terminated during this sync.
        sessions_notified:
          type: integer
          description: Open sessions that received a `target_lost` message because their instance left the pool.

    # ---------------------------------------------------------------- user-facing targets and connect
    ReachableTarget:
      type: object
      description: A target, autoscaling group or application the caller may reach, as returned by `GET /me/targets`.
      required: [kind, id, name, os_family, tags, capabilities, allowed_protocols, host_key_ready]
      properties:
        kind:
          type: string
          enum: [target, asg, application]
        id:
          type: string
        name:
          type: string
        os_family:
          $ref: "#/components/schemas/OsFamily"
        tags:
          $ref: "#/components/schemas/Tags"
        capabilities:
          type: array
          description: Protocols the target's probe found it actually offers.
          items:
            $ref: "#/components/schemas/Protocol"
        allowed_protocols:
          type: array
          description: The protocols the caller's grants give on it, intersected with its capabilities. The UI enables a button only for protocols listed here.
          items:
            $ref: "#/components/schemas/Protocol"
        requires_approval:
          type: array
          description: >-
            Protocols the caller may reach only through just-in-time approval (ADR 0018) — the
            target is covered for them by approval grants alone. The UI shows a Request
            button rather than Connect. Absent or empty when every allowed protocol has standing
            access.
          items:
            $ref: "#/components/schemas/Protocol"
        own_login:
          type: array
          description: >-
            Protocols on which the caller may sign in with their own login instead of the
            target's (ADR 0036): a grant that admits them says `sign_in: own`. Where another
            grant lets the target decide, the UI offers *Use my own login* beside the protocol;
            where none does, the connect must carry `credential`. Absent when there are none.
          items:
            $ref: "#/components/schemas/Protocol"
        host_key_ready:
          type: boolean
          description: >-
            True once the target's SSH host key is trusted. While false (key untrusted, or changed
            and awaiting re-trust) the UI blocks an SSH connect; non-SSH protocols are unaffected.
        private_ip:
          type: [string, "null"]
          description: >-
            The target's private (RFC1918 / ULA) address when it has one, shown to help users tell
            their assigned machines apart. A public address or a hostname is never surfaced here.
        engine:
          type: [string, "null"]
          description: For a database target, the engine name (for example `postgres`). Absent for non-database targets.
        healthy_count:
          type: integer
          description: Healthy instances in the group. Present only for autoscaling-group rows (`kind` is `asg`).
        instance_count:
          type: integer
          description: Total instances in the group. Present only for autoscaling-group rows (`kind` is `asg`).
    UserSuppliedCredential:
      type: object
      description: >-
        Sent only when the target's credential for that protocol has `mode=user_supplied`, or
        when the caller signs in with their own login on a protocol `own_login` lists. Never
        stored. A username with a `password`, or, for `ssh` only, with the person's own
        `private_key` (OpenSSH, PKCS#8 or PKCS#1, at most 16 KiB) and its
        `private_key_passphrase` when it is encrypted; the key is unlocked when the ticket is
        issued and used for that session alone.
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
        private_key:
          type: string
          writeOnly: true
        private_key_passphrase:
          type: string
          writeOnly: true
        domain:
          type: string
    ConnectRequest:
      type: object
      required: [protocol]
      description: Exactly one of `target_id` or `asg_instance_id` must be set.
      properties:
        target_id:
          type: string
        asg_instance_id:
          type: string
        protocol:
          $ref: "#/components/schemas/Protocol"
        credential:
          $ref: "#/components/schemas/UserSuppliedCredential"
        terminal:
          type: object
          properties:
            cols:
              type: integer
            rows:
              type: integer
        display:
          type: object
          properties:
            width:
              type: integer
            height:
              type: integer
            dpi:
              type: integer
    ConnectTicket:
      type: object
      description: >
        A one-time pass for the WebSocket that carries the session. The session id and the
        policy's limits are not here: the session starts when the WebSocket opens, and its
        first message carries them.
      required: [ticket, expires_at, ws_path]
      properties:
        ticket:
          type: string
          description: >
            One-time, 32 bytes of randomness, base64url. Present as `?ticket=` on the WebSocket
            URL. It works once, only from the address that asked for it, and only until
            `expires_at`, 30 seconds after it was issued.
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        ws_path:
          type: string
          enum: [/ws/terminal, /ws/desktop, /ws/winrm, /ws/database]
          description: The WebSocket endpoint that redeems this ticket, chosen by protocol.
        asg_id:
          type: string
          description: Set when the session is on an autoscaling group's instance.
        asg_instance_id:
          type: string
        instance_label:
          type: string
          description: The instance the session lands on, as "instance id · availability zone".

    # ---------------------------------------------------------------- sessions
    OwnSession:
      type: object
      required: [id, protocol, target_name, started_at]
      properties:
        id:
          type: string
        protocol:
          $ref: "#/components/schemas/Protocol"
        target_name:
          type: string
        target_id:
          type: [string, "null"]
        asg_id:
          type: [string, "null"]
        asg_instance_id:
          type: [string, "null"]
        instance_id:
          type: [string, "null"]
          description: The cloud instance id when the session was against an autoscaling instance.
        asg_name:
          type: [string, "null"]
          description: The autoscaling group's name when the session was against one of its instances. Resolved at read time; a retired group still labels its past sessions.
        started_at:
          $ref: "#/components/schemas/Timestamp"
        ended_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        end_reason:
          oneOf:
            - $ref: "#/components/schemas/EndReason"
            - type: "null"
        failover_from_session_id:
          type: [string, "null"]
    FileEntry:
      type: object
      required: [name, path, dir, size, mode, mtime]
      properties:
        name:
          type: string
        path:
          type: string
          description: The full path, to pass back as `path`.
        dir:
          type: boolean
          description: True for a folder.
        size:
          type: integer
          format: int64
        mode:
          type: string
          description: Permission bits as text, for example `-rw-r--r--`.
        mtime:
          type: integer
          format: int64
          description: Last modified, in Unix seconds.
    AccessSession:
      allOf:
        - $ref: "#/components/schemas/OwnSession"
        - type: object
          required: [user_id, username, client_ip, has_recording]
          properties:
            user_id:
              type: string
            username:
              type: string
            policy_id:
              type: [string, "null"]
            credential_id:
              type: [string, "null"]
            client_ip:
              type: string
            user_agent:
              type: string
            has_recording:
              type: boolean
            recording_id:
              type: [string, "null"]
              description: Present only when the caller holds `auditor` or `admin`.

    # ---------------------------------------------------------------- recordings
    Recording:
      type: object
      required: [id, session_id, format, size_bytes, started_at, created_at, session, view_count]
      properties:
        id:
          type: string
        session_id:
          type: string
        format:
          $ref: "#/components/schemas/RecordingFormat"
        size_bytes:
          type: integer
          format: int64
        sha256:
          type: [string, "null"]
          description: Set when the recording is finished.
        started_at:
          $ref: "#/components/schemas/Timestamp"
        finished_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        retention_until:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        session:
          $ref: "#/components/schemas/AccessSession"
        view_count:
          type: integer
    Setting:
      type: object
      description: A runtime setting resolved with its precedence (ADR 0020).
      required: [key, category, title, description, type, default, value, source]
      properties:
        key:
          type: string
        category:
          type: string
          description: Section the console groups it under.
        title:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [string, text, bool, enum, hostport, timezone]
          description: How the value is edited and validated; `bool` values are the strings `true` and `false`; `timezone` is an IANA zone name the gateway can load.
        default:
          type: string
          description: The built-in default.
        env_var:
          type: string
          description: The environment variable `init` writes for it, when it has one.
        enum:
          type: array
          items:
            type: string
          description: Allowed values when `type` is `enum`.
        value:
          type: string
          description: The effective value.
        source:
          type: string
          enum: [default, environment, console]
          description: Where the effective value came from.
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        updated_by:
          type: string
          description: User id of the administrator who set the console value; present only when `source` is `console`.
    BootSetting:
      type: object
      description: >-
        A setting fixed at install from the environment. Most are read-only in the console;
        those with `editable` can be changed through `POST /admin/settings/boot`.
      required: [key, title, env_var, value]
      properties:
        key:
          type: string
        title:
          type: string
        env_var:
          type: string
          description: The variable (or family of variables) to edit, then restart the gateway.
        value:
          type: string
          description: Masked where it is a secret.
        editable:
          type: string
          enum: [value, preset]
          description: How the console may change it through the root helper (ADR 0020, amended 2026-10-30); absent, install-only.
        raw:
          type: string
          description: An editable variable's value as the file has it; allowlisted variables hold no secret.
        description:
          type: string
    EnvFileReport:
      type: object
      description: The environment file compared with what the process started with. Names only, never values.
      required: [state, checked_at]
      properties:
        path:
          type: string
        state:
          type: string
          enum: [unchanged, changed, missing, unreadable, none]
          description: >
            `changed` means a restart is required; `missing` and `none` mean there is no file to
            compare (containers); `unreadable` names the permission problem in `error`.
        changed:
          type: array
          items:
            type: string
          description: Variables whose value differs, including ones added or removed, sorted.
        error:
          type: string
        mod_time:
          $ref: "#/components/schemas/Timestamp"
        checked_at:
          $ref: "#/components/schemas/Timestamp"
    TLSCertInfo:
      type: object
      required: [source, subject, issuer, hosts, not_before, not_after, fingerprint, self_signed]
      properties:
        source:
          type: string
          enum: [uploaded, file, generated]
        subject:
          type: string
        issuer:
          type: string
        hosts:
          type: array
          items:
            type: string
        not_before:
          $ref: "#/components/schemas/Timestamp"
        not_after:
          $ref: "#/components/schemas/Timestamp"
        fingerprint:
          type: string
          description: SHA-256 of the leaf certificate, hex.
        self_signed:
          type: boolean
        cert_pem:
          type: string
        problem:
          type: string
          description: >
            Why a stored certificate cannot serve now (it expired, is not valid yet, or does
            not allow server authentication). An uploaded certificate with a problem is kept,
            not deleted; the gateway serves the next certificate in line until it is replaced
            or removed.
    TLSStatus:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [file, managed, proxy]
        active:
          $ref: "#/components/schemas/TLSCertInfo"
        uploaded:
          $ref: "#/components/schemas/TLSCertInfo"
        generated:
          $ref: "#/components/schemas/TLSCertInfo"
        file_hint:
          type: string
          description: Names the environment variables when a file certificate is in use.
    StorageConfig:
      type: object
      description: An S3-compatible bucket for recordings. The secret is write-only.
      required: [bucket, auth]
      properties:
        bucket:
          type: string
        prefix:
          type: string
          description: Key prefix inside the bucket; default recordings/.
        region:
          type: string
        endpoint:
          type: string
          description: For S3-compatible services; path-style addressing is used when set.
        kms_key_id:
          type: string
          description: Server-side encryption with this KMS key; empty uses AES-256.
        auth:
          type: string
          enum: [role, keys]
          description: The SDK's default chain (instance role, environment) or a static access key.
        access_key_id:
          type: string
          description: In responses, only its last four characters.
        secret_access_key:
          type: string
          description: Requests only; sealed by the key ring, never returned.
        secret_set:
          type: boolean
          description: Responses only.
    StorageStatus:
      type: object
      required: [source, counts, move]
      properties:
        source:
          type: string
          enum: [console, environment, local]
        active:
          $ref: "#/components/schemas/StorageConfig"
        environment:
          $ref: "#/components/schemas/StorageConfig"
        counts:
          type: object
          additionalProperties:
            type: integer
          description: Recordings per store, keyed local or s3://bucket.
        move:
          type: object
          properties:
            running:
              type: boolean
            started_at:
              $ref: "#/components/schemas/Timestamp"
            finished_at:
              $ref: "#/components/schemas/Timestamp"
            moved:
              type: integer
            failed:
              type: integer
            total:
              type: integer
            last_error:
              type: string
    SessionCounts:
      type: object
      required: [open, started_24h]
      properties:
        open:
          type: integer
          description: Sessions open now, the number the Sessions pages list.
        started_24h:
          type: integer
          description: Sessions started in the last 24 hours.
    AuditTallies:
      type: object
      required: [events, failures, failed_logins, refused_connects]
      properties:
        events:
          type: integer
          description: Events recorded in the last 24 hours.
        failures:
          type: integer
          description: Of those, how many recorded a failure outcome.
        failed_logins:
          type: integer
          description: Failed sign-ins (`user.login` failures).
        refused_connects:
          type: integer
          description: Refused connections (`session.connect` failures).
    AdminOverview:
      type: object
      required: [sessions, pending_requests, targets, inventory, autoscaling, audit_24h, posture, integrity, in_flight, trends, storage]
      properties:
        storage:
          type: object
          description: What the evidence takes (2026-10-31), for the dashboard's storage tiles.
          required: [audit_log, recordings]
          properties:
            audit_log:
              type: object
              required: [events, approx_bytes]
              properties:
                events: {type: integer, format: int64, description: Events in the audit log; none is ever deleted.}
                approx_bytes:
                  type: integer
                  format: int64
                  description: >-
                    About how much room the events take: the newest thousand rows' average length
                    times `events`. Characters rather than bytes, indexes left out; an estimate.
            recordings:
              type: object
              required: [count, bytes]
              properties:
                count: {type: integer, format: int64, description: Finished recordings that retention has not purged, wherever they are stored.}
                bytes: {type: integer, format: int64, description: Their total size, exact.}
        trends:
          type: object
          description: >
            The last seven calendar days in the console's time zone (`display.time_zone`,
            UTC when unset), oldest first and today last, today counted so far
            (2026-10-31). Calendar days, not 24-hour windows from now, so a day here is the
            day the Events page's filter shows; a day with a daylight-saving change has its
            true length.
          required: [days, sessions, refused]
          properties:
            days:
              type: array
              items: {type: string, format: date}
              description: Each day as YYYY-MM-DD; seven entries.
            sessions:
              type: array
              items: {type: integer}
              description: Sessions started on each day, matched to `days` by index.
            refused:
              type: array
              items: {type: integer}
              description: Refused connections (`session.connect` failures) on each day.
        in_flight:
          type: object
          description: Access in flight (2026-10-31).
          required: [active, ending_soon, oldest_pending_seconds]
          properties:
            active: {type: integer, description: Just-in-time grants approved and not yet ended.}
            ending_soon: {type: integer, description: Of those, how many end within the hour.}
            oldest_pending_seconds: {type: integer, description: How long the oldest pending request has waited; 0 when none waits.}
        integrity:
          type: object
          description: Whether the evidence is whole (2026-10-31), counts only.
          required: [audit_chain, recordings_lost_7d, directories, export]
          properties:
            audit_chain:
              description: >
                The background check of the whole chain, run a minute after start and every six
                hours; null before the first check, which the console shows as not checked yet.
              oneOf:
                - type: "null"
                - type: object
                  required: [at, intact, checked, problems]
                  properties:
                    at: {$ref: "#/components/schemas/Timestamp"}
                    intact: {type: boolean}
                    checked: {type: integer, description: Events walked.}
                    problems: {type: integer}
                    error: {type: string, description: A check that could not run; says nothing about the chain.}
            recordings_lost_7d:
              type: integer
              description: recording.lost failures in the last seven days.
            directories:
              type: object
              description: Identity providers listed on a schedule; the Identity providers page has each one's status.
              required: [listed, failing, not_run, held_back]
              properties:
                listed: {type: integer}
                failing: {type: integer}
                not_run: {type: integer}
                held_back: {type: integer, description: Accounts the last runs did not disable.}
            export:
              type: object
              required: [sinks, behind]
              properties:
                sinks: {type: integer, description: SIEM sinks configured.}
                behind: {type: integer, description: Events the furthest-behind sink has not shipped.}
        posture:
          type: object
          description: What weakens access (2026-10-31), counts only.
          required: [standing_no_mfa, admins, dormant, not_enrolled]
          properties:
            standing_no_mfa:
              type: object
              required: [grants, policies]
              description: Standing grants that ask for no authenticator, in enabled policies, and the policies holding them.
              properties:
                grants: {type: integer}
                policies: {type: integer}
            admins:
              type: integer
              description: Active accounts holding admin.
            dormant:
              type: integer
              description: Active accounts whose last sign-in, or creation when they never signed in, is more than 90 days old.
            not_enrolled:
              type: integer
              description: >
                Active accounts whose second factor is Zanskar's authenticator (a password, an LDAP
                link, or a provider that leaves it to Zanskar) and that have not confirmed one.
        sessions:
          $ref: "#/components/schemas/SessionCounts"
        pending_requests:
          type: integer
          description: Access requests awaiting a decision.
        inventory:
          type: object
          required: [hosts, hosts_by_os, databases, databases_by_engine, applications]
          description: The active fleet, for the dashboard's inventory tiles.
          properties:
            hosts:
              type: integer
            hosts_by_os:
              type: object
              additionalProperties:
                type: integer
              description: Active hosts by OS family (linux, windows, other).
            databases:
              type: integer
            databases_by_engine:
              type: object
              additionalProperties:
                type: integer
              description: Active database targets by engine.
            applications:
              type: integer
              description: Active applications (ADR 0034).
        autoscaling:
          type: object
          required: [groups, instances, healthy_instances]
          properties:
            groups:
              type: integer
              description: Enrolled autoscaling groups.
            instances:
              type: integer
              description: Live (unterminated) instances across all groups.
            healthy_instances:
              type: integer
              description: Of those, how many are healthy, counted as the Autoscaling page counts them.
        targets:
          type: object
          required: [active, host_key_pending, host_key_changed, certificate_pending, needing_attention]
          properties:
            active:
              type: integer
              description: Active hosts.
            host_key_pending:
              type: integer
              description: Targets whose host key was seen but not yet trusted.
            host_key_changed:
              type: integer
              description: Targets whose host key changed after trust; connections are refused until resolved.
            certificate_pending:
              type: integer
              description: Targets with an RDP or WinRM certificate pin awaiting confirmation.
            needing_attention:
              type: integer
              description: Hosts waiting on any of the three, each counted once; `GET /targets?kind=host&attention=true` lists them.
        audit_24h:
          $ref: "#/components/schemas/AuditTallies"
    AuditOverview:
      type: object
      required: [sessions, events_24h, reviews_24h]
      properties:
        sessions:
          $ref: "#/components/schemas/SessionCounts"
        events_24h:
          $ref: "#/components/schemas/AuditTallies"
        reviews_24h:
          type: object
          required: [recording_views, recording_downloads]
          properties:
            recording_views:
              type: integer
              description: Recording playbacks in the last 24 hours.
            recording_downloads:
              type: integer
              description: Recording downloads in the last 24 hours.
    HostStatus:
      type: object
      required: [hostname, supervisor, available, mfa_fresh, step_up_minutes]
      properties:
        hostname:
          type: string
        supervisor:
          type: string
        available:
          type: boolean
        reason:
          type: string
        mfa_fresh:
          type: boolean
        step_up_minutes:
          type: integer
    HostActionRequest:
      type: object
      required: [confirm]
      properties:
        wait_minutes:
          type: integer
          minimum: 0
          maximum: 240
          default: 15
          description: How long to let live sessions finish; 0 ends them now.
        confirm:
          type: string
          description: The gateway's hostname, typed.
    UpdateStatus:
      type: object
      required: [current, newer, enabled]
      properties:
        current:
          type: string
        latest:
          type: string
        notes_url:
          type: string
        published_at:
          type: string
        newer:
          type: boolean
        checked_at:
          $ref: "#/components/schemas/Timestamp"
        error:
          type: string
        enabled:
          type: boolean
        installable:
          type: boolean
          description: The console may ask for the install (a systemd host with a state directory).
        install:
          type: object
          description: The installer's last report, when there is one.
          required: [state, version, message, at]
          properties:
            state:
              type: string
              enum: [running, done, failed]
            version:
              type: string
            message:
              type: string
            at:
              type: string
    SystemMetrics:
      type: object
      required: [disks, database_sessions, application_sessions, session_caps]
      properties:
        cpu:
          type: object
          required: [percent, window_seconds]
          description: >-
            How busy the processors were over the last sampling window, as a
            share of all of them (0 to 100); the first request measures a
            short window of its own, later ones measure since the previous
            request, and a previous reading older than 30 seconds starts a
            fresh short window instead. Omitted off Linux.
          properties:
            percent:
              type: number
            window_seconds:
              type: number
        load:
          type: object
          required: [one, five, fifteen]
          description: Load averages; omitted off Linux.
          properties:
            one:
              type: number
            five:
              type: number
            fifteen:
              type: number
        memory:
          type: object
          required: [total_bytes, available_bytes]
          description: Host memory; omitted off Linux.
          properties:
            total_bytes:
              type: integer
            available_bytes:
              type: integer
        disks:
          type: array
          items:
            type: object
            required: [what, path, system, total_bytes, free_bytes]
            properties:
              what:
                type: string
                description: database, recordings, or "database & recordings" when they share a filesystem.
              path:
                type: string
              system:
                type: boolean
                description: The location sits on the root filesystem, so the numbers are the OS disk's.
              total_bytes:
                type: integer
              free_bytes:
                type: integer
                description: Available to the service, as df's Avail.
              used_bytes:
                type: integer
                description: >
                  Blocks in use, as df's Used. The console's percentage is df's Use%,
                  used / (used + free), rounded up, so the root-reserved blocks count as
                  neither (1.9.0).
        database_sessions:
          type: integer
          description: Database client containers running now, one per live database session.
        application_sessions:
          type: integer
          description: Application browsers running now, one per live application session (ADR 0034).
        session_caps:
          type: object
          required: [applications, databases]
          description: >
            The caps on concurrent sessions of each kind (`ZANSKAR_APPS_MAX_SESSIONS`,
            `ZANSKAR_DATABASE_MAX_SESSIONS`); 0 for none. A count at its cap means the next
            connection of that kind is refused with 503 (2026-10-31).
          properties:
            applications:
              type: integer
            databases:
              type: integer
        images_bytes:
          type: integer
          description: >
            Disk the container images Zanskar pulled take on the host, each image's size
            summed (layers two images share count twice, as `docker image ls` shows). Read
            in the background at most every five minutes, so the answer never waits on the
            container runtime; omitted until the first read ends, without a container
            runtime, or when the last read failed (2026-10-31).
        cpus:
          type: integer
          description: Logical CPUs, to scale the load average.
        guacd:
          type: object
          required: [address, reachable]
          description: Omitted when no guacd address is configured.
          properties:
            address:
              type: string
            reachable:
              type: boolean
    SystemStatus:
      type: object
      required: [version, started_at, uptime_seconds, supervisor, live_sessions, env_file, restart_required, draining]
      properties:
        version:
          type: string
        started_at:
          $ref: "#/components/schemas/Timestamp"
        uptime_seconds:
          type: integer
        supervisor:
          type: string
          enum: [systemd, kubernetes, unknown]
          description: What starts the process again after a restart, when it can be told.
        live_sessions:
          type: integer
        env_file:
          $ref: "#/components/schemas/EnvFileReport"
        restart_required:
          type: boolean
        draining:
          type: boolean
        now:
          $ref: "#/components/schemas/Timestamp"
          description: The gateway's clock, for the dashboard's clock (1.9.0).
        drain:
          type: object
          description: The restart in progress, when there is one.
          properties:
            requested_at:
              $ref: "#/components/schemas/Timestamp"
            requested_by:
              type: string
              description: User id of the administrator.
            deadline:
              $ref: "#/components/schemas/Timestamp"
            wait_minutes:
              type: integer
    RetentionPolicy:
      type: object
      required: [max_age_days, max_total_bytes]
      properties:
        max_age_days:
          type: integer
          minimum: 0
          description: Days to keep recordings; 0 keeps them indefinitely by age.
        max_total_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Total-size backstop in bytes; 0 means no cap.
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        updated_by:
          type: string
          description: User id that last changed the policy; absent until first set.

    # ---------------------------------------------------------------- audit
    AuditEvent:
      type: object
      required: [id, ts, actor_ip, action, object_type, object_id, outcome, details, prev_hash, hash]
      properties:
        id:
          type: integer
          format: int64
        ts:
          $ref: "#/components/schemas/Timestamp"
        actor_user_id:
          type: [string, "null"]
        actor_username:
          type: [string, "null"]
          description: Resolved at read time; null when the user no longer exists.
        details_names:
          type: object
          additionalProperties:
            type: string
          description: >
            Names for the ids inside `details`, keyed by the detail key (`target_id` → `web-1`).
            Read-time decoration only; the stored details and the hashed fields are untouched.
        actor_ip:
          type: string
        action:
          type: string
          examples: [user.login, target.host_key.trust, session.start, recording.view]
        object_type:
          type: string
        object_id:
          type: string
        outcome:
          $ref: "#/components/schemas/Outcome"
        details:
          type: object
          description: Action-specific fields. Never contains secrets.
        prev_hash:
          type: string
        hash:
          type: string
    AuditVerifyResult:
      type: object
      required: [intact, checked, last_id, last_hash, broken, anchors_checked, last_anchor, problems, warnings]
      properties:
        intact:
          type: boolean
          description: >
            True when every event checked out and `problems` is empty. A log whose newest events
            were deleted still links, so `broken` can be null while `intact` is false.
        checked:
          type: integer
          format: int64
          description: Events verified before the walk ended or stopped at a break.
        last_id:
          type: integer
          format: int64
          description: The id of the last event that verified; 0 for an empty log.
        last_hash:
          type: string
          description: The hash of the last event that verified; 64 zeros for an empty log.
        broken:
          description: The first break, or null when the chain is intact.
          oneOf:
            - type: "null"
            - type: object
              required: [Index, ID, Reason]
              properties:
                Index:
                  type: integer
                  description: Position of the broken event in the walk, counting from 0.
                ID:
                  type: integer
                  format: int64
                  description: The broken event's id.
                Reason:
                  type: string
                  description: Why it failed, for example `prev_hash does not match previous event` or `hash does not match content`.
        anchors_checked:
          type: integer
          description: How many stored anchors were checked. The gateway writes one at start and every hour.
        last_anchor:
          description: >
            The matching anchor that names the newest event: its signature verifies and its event
            is still in the log with the hash it signed. Null when no anchor matches.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/AuditAnchor"
        problems:
          type: array
          description: >
            What the anchor and id-sequence checks found, as sentences. Each is evidence that the
            log was truncated or edited (an anchored event missing or changed, the log ending
            before an anchored event, on SQLite an id sequence ahead of the newest event) or that
            an anchor was not written by this gateway. Anchors past the first 20 with a finding of
            their own are counted in one closing entry.
          items:
            type: string
        warnings:
          type: array
          description: >
            Findings that may be innocent and do not make `intact` false. On PostgreSQL an id
            sequence ahead of the newest event is a warning, since a failed insert also uses up an id.
          items:
            type: string
    AuditAnchor:
      type: object
      description: >
        The head of the audit chain at one moment, signed with HMAC-SHA256 under a key derived from
        the master key (ADR 0008). `zanskar audit anchor` prints one as
        `anchor <event_id> <hash> <created_at> <mac>`.
      required: [id, event_id, hash, created_at, mac]
      properties:
        id:
          type: integer
          format: int64
          description: The stored anchor's id.
        event_id:
          type: integer
          format: int64
          description: The id of the event the anchor names.
        hash:
          type: string
          description: That event's hash when the anchor was written.
        created_at:
          type: string
          format: date-time
          description: When the anchor was written.
        mac:
          type: string
          description: The signature, 64 hexadecimal characters.
