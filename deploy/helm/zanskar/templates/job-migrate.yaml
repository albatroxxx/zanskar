{{- if .Values.migrate.enabled }}
# Applies pending migrations before the new gateway version starts. The
# gateway itself refuses to serve with migrations pending, so this hook is
# what makes an upgrade a single `helm upgrade`.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "zanskar.fullname" . }}-migrate
  labels:
    {{- include "zanskar.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "zanskar.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- include "zanskar.podSecurityContext" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "zanskar.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          securityContext:
            {{- include "zanskar.containerSecurityContext" . | nindent 12 }}
          env:
            # migrate needs only the database; the master key is not required.
            - name: ZANSKAR_DB_DRIVER
              value: {{ .Values.config.dbDriver | quote }}
            - name: ZANSKAR_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: ZANSKAR_DB_DSN
            - name: ZANSKAR_LOG_FORMAT
              value: {{ .Values.config.logFormat | quote }}
{{- end }}
