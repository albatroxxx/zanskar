version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - nolintlint
    - revive
    - sqlclosecheck
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        - G104 # handled by errcheck
formatters:
  enable:
    - gofmt
    - goimports
