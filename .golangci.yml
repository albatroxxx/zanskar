version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - nolintlint
    - revive
    - sqlclosecheck
    - unconvert
    - unparam
  settings:
    errcheck:
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (net.Conn).Close
        - (*net.TCPConn).Close
        - (*github.com/coder/websocket.Conn).CloseNow
        - (*golang.org/x/crypto/ssh.Client).Close
        - (*golang.org/x/crypto/ssh.ServerConn).Close
        - (golang.org/x/crypto/ssh.Channel).Close
    gosec:
      excludes:
        - G104 # handled by errcheck
    revive:
      rules:
        - name: var-naming
          arguments: [[], [], [{skip-initialism-name-checks: true}]]
  exclusions:
    rules:
      - path: _test\.go
        linters: [noctx, gosec]
      # `zanskar init` reads the operator-specified env file back to preserve its
      # master key; the variable path is the point, not a vulnerability.
      - path: cmd/zanskar/init\.go
        linters: [gosec]
        text: "G304"
      # backup/restore does controlled filesystem I/O (snapshot, tar, restore);
      # the untrusted extraction path rejects traversal explicitly in code.
      - path: cmd/zanskar/backup\.go
        linters: [gosec]
formatters:
  enable:
    - gofmt
    - goimports
